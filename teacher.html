<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>워크시트 교사용</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { mint: { 50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',400:'#34d399',500:'#10B981',600:'#059669',700:'#047857',800:'#065f46' } },
  fontFamily: { sans: ['Pretendard','sans-serif'] } } } }
</script>
<style>
  body { background:#F8FAFC; font-family:'Pretendard',sans-serif; }
  input, select, textarea { font-size:16px; }
  .fieldbox:focus { outline:none; box-shadow:0 0 0 3px rgba(16,185,129,.18); }
  button:focus-visible, a:focus-visible, select:focus-visible { outline:2px solid #059669; outline-offset:2px; }
  [hidden] { display:none !important; }
  .grid-cell { min-width:44px; }
  @media print {
    .no-print { display:none !important; } body { background:#fff; }
    body.detail-open #app { display:none !important; }
    #detailWrap { position:static !important; display:block !important; background:none !important; }
    #detail { position:static !important; height:auto !important; max-width:none !important; overflow:visible !important; box-shadow:none !important; }
    #detail .sticky { position:static !important; }
    section { break-inside:avoid; }
  }
</style>
</head>
<body class="text-slate-800">

<!-- 열쇠 입력 -->
<section id="gate" class="max-w-md mx-auto px-4 py-12">
  <div class="bg-white rounded-2xl shadow-md p-6 sm:p-8">
    <h1 class="text-xl font-bold tracking-tight">워크시트 교사용 화면</h1>
    <p class="text-sm text-slate-500 mt-1.5 leading-relaxed">교사 열쇠를 넣으면 모든 반·팀의 워크시트와 주간 제출을 볼 수 있음.</p>
    <form id="gateForm" class="mt-6 space-y-4" autocomplete="off">
      <div>
        <label for="gKey" class="block text-sm font-bold mb-1.5">교사 열쇠</label>
        <input id="gKey" type="password" autocomplete="off" class="fieldbox w-full px-4 py-2.5 rounded-2xl bg-slate-50 text-base">
      </div>
      <label for="gRemember" class="flex items-center gap-2 text-sm text-slate-500"><input id="gRemember" type="checkbox" class="w-5 h-5"> 이 기기에서 기억하기 (교사 개인 기기에서만)</label>
      <button type="submit" class="w-full px-4 py-3 text-base font-semibold rounded-2xl bg-mint-500 text-white shadow-sm hover:bg-mint-600 active:scale-95 transition-all duration-200">열기</button>
      <p id="gMsg" class="text-sm text-slate-500" role="status"></p>
    </form>
  </div>
</section>

<div id="app" hidden>
  <header class="sticky top-0 z-20 bg-[#F8FAFC]/90 backdrop-blur border-b border-slate-200/60 no-print">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center gap-3 justify-between">
      <div>
        <h1 class="text-lg sm:text-xl font-bold tracking-tight">워크시트 교사용</h1>
        <p id="stamp" class="text-xs text-slate-400 mt-0.5">—</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <select id="fClass" class="fieldbox px-3 py-2 rounded-2xl bg-white shadow-sm text-sm" aria-label="반">
          <option value="">전체 반</option>
          <option value="1">1반</option><option value="2">2반</option><option value="3">3반</option><option value="4">4반</option>
          <option value="5">5반</option><option value="6">6반</option><option value="7">7반</option><option value="8">8반</option>
        </select>
        <select id="fWeek" class="fieldbox px-3 py-2 rounded-2xl bg-white shadow-sm text-sm" aria-label="주"></select>
        <button id="btnRefresh" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-white text-slate-700 shadow-sm active:scale-95 transition-all duration-200">새로 고침</button>
        <button id="btnCsv" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-white text-slate-700 shadow-sm active:scale-95 transition-all duration-200">제출 현황 CSV</button>
        <button id="btnOut" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-white text-slate-500 shadow-sm active:scale-95 transition-all duration-200">잠그기</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 pb-24 space-y-6">
    <div id="banner" class="hidden rounded-2xl p-4 text-sm font-semibold" role="status"></div>

    <!-- 요약 -->
    <section id="summary" class="grid grid-cols-2 sm:grid-cols-4 gap-3 no-print"></section>

    <!-- 팀 목록 -->
    <section id="list" class="bg-white rounded-2xl shadow-sm overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-2 flex-wrap">
        <h2 class="font-bold">팀별 현황</h2>
        <p class="text-xs text-slate-400">팀을 누르면 워크시트를 볼 수 있음</p>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-left text-slate-500 bg-slate-50">
            <tr><th class="px-4 py-2.5 font-semibold">반</th><th class="px-4 py-2.5 font-semibold">팀</th><th class="px-4 py-2.5 font-semibold">팀장</th><th class="px-4 py-2.5 font-semibold">인원</th><th class="px-4 py-2.5 font-semibold w-40">진행률</th><th class="px-4 py-2.5 font-semibold">마지막 수정</th><th class="px-4 py-2.5 font-semibold" id="thWeek">이번 주 제출</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <!-- 주간 제출 표 -->
    <section id="grid" class="bg-white rounded-2xl shadow-sm overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100"><h2 class="font-bold">주별 제출 기록</h2><p class="text-xs text-slate-400 mt-0.5">● 제출함 · ○ 안 함 — 칸을 누르면 그 주 제출본을 봄</p></div>
      <div class="overflow-x-auto"><table class="text-sm" id="gridTable"></table></div>
    </section>
  </main>
</div>

<!-- 팀 상세 -->
<div id="detailWrap" hidden class="fixed inset-0 z-40 bg-slate-900/40 flex justify-end">
  <aside id="detail" class="bg-[#F8FAFC] w-full max-w-3xl h-full overflow-auto shadow-xl" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="sticky top-0 z-10 bg-white border-b border-slate-200 px-5 py-4 flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h2 id="dTitle" class="text-lg font-bold truncate">—</h2>
        <p id="dSub" class="text-xs text-slate-500 mt-0.5">—</p>
      </div>
      <div class="flex gap-2 no-print">
        <button id="dPrint" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-white border border-slate-200 text-slate-700 active:scale-95 transition-all duration-200">인쇄</button>
        <button id="dClose" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-slate-800 text-white active:scale-95 transition-all duration-200">닫기</button>
      </div>
    </div>
    <div class="px-5 py-5 space-y-5">
      <div id="dViewBar" class="flex flex-wrap gap-2 no-print"></div>
      <div id="dNote" class="hidden rounded-2xl bg-mint-50 text-mint-700 p-4 text-sm"></div>
      <div id="dBody" class="space-y-4"></div>
      <section class="bg-white rounded-2xl shadow-sm p-5 no-print">
        <h3 class="font-bold">첨부 파일</h3>
        <ul id="dFiles" class="mt-3 space-y-2 text-sm"></ul>
      </section>
      <section class="bg-white rounded-2xl shadow-sm p-5 no-print">
        <h3 class="font-bold">팀 비밀번호 새로 정하기</h3>
        <p class="text-xs text-slate-500 mt-1 leading-relaxed">학생들이 비밀번호를 잊었을 때 씀. 바꾸면 그 팀의 모든 기기가 나가지고, 새 비밀번호로 다시 들어가야 함. 잠김도 풀림.</p>
        <div class="mt-3 flex gap-2">
          <input id="dPw" type="text" maxlength="40" autocomplete="off" class="fieldbox flex-1 px-4 py-2.5 rounded-2xl bg-slate-50 text-base" placeholder="새 비밀번호 (4자 이상)">
          <button id="dPwBtn" type="button" class="px-4 py-2.5 text-sm font-semibold rounded-2xl bg-rose-500 text-white active:scale-95 transition-all duration-200">바꾸기</button>
        </div>
        <p id="dPwMsg" class="text-sm mt-2" role="status"></p>
      </section>
    </div>
  </aside>
</div>

<script>
/*SIMRUN-BEGIN*/
/* ============================================================
   시뮬레이션 실행기 (학생용·교사용 공통) — 파이썬은 브라우저 안 Pyodide, HTML은 격리된 틀(iframe) 안에서 실행
   ============================================================ */
const SimRun = (() => {
  const PYODIDE_BASE = 'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/';
  const MAX_CODE = 1500000, MAX_OUT = 200000, MAX_FIGS = 30;
  const WORKER_SRC = [
    "var BASE=" + JSON.stringify(PYODIDE_BASE) + ";",
    "var FONT_URL='https://cdn.jsdelivr.net/npm/@fontsource/nanum-gothic@5.3.0/files/nanum-gothic-korean-400-normal.woff';",
    "var py=null, ready=null;",
    "function boot(){ if(!ready){ ready=(async function(){ importScripts(BASE+'pyodide.js'); py=await loadPyodide({indexURL:BASE}); self.cnImage=function(b){postMessage({type:'img',data:b})}; return py; })(); } return ready; }",
    "onmessage=async function(e){",
    "  var m=e.data;",
    "  if(m.type==='warm'){ try{ await boot(); postMessage({type:'ready'}); }catch(err){ postMessage({type:'fatal',text:String(err&&err.message||err)}); } return; }",
    "  if(m.type!=='run') return;",
    "  var t0=Date.now();",
    "  try{ postMessage({type:'status',text:'파이썬 준비 중… (처음 한 번은 10~30초)'}); await boot(); }",
    "  catch(err){ postMessage({type:'fatal',text:String(err&&err.message||err)}); return; }",
    "  var lines=(m.stdin||'').split('\\n'), li=0;",
    "  py.setStdin({stdin:function(){ if(li<lines.length){ return lines[li++]; } return undefined; }, isatty:false});",
    "  py.setStdout({batched:function(s){ postMessage({type:'out',text:s}); }});",
    "  py.setStderr({batched:function(s){ postMessage({type:'err',text:s}); }});",
    "  var ns=null;",
    "  try{",
    "    postMessage({type:'status',text:'필요한 패키지 확인 중…'});",
    "    await py.loadPackagesFromImports(m.code,{messageCallback:function(t){ if(/Loading|Loaded/.test(t)) postMessage({type:'status',text:t}); }, errorCallback:function(t){ postMessage({type:'err',text:t}); }});",
    "    ns=py.globals.get('dict')(); ns.set('__name__','__main__');",
    "    var mpl=/matplotlib|pyplot|pylab/.test(m.code);",
    "    if(mpl&&!self.cnFont){ try{ var fr=await fetch(FONT_URL); if(fr.ok){ py.FS.writeFile('/tmp/ng.woff', new Uint8Array(await fr.arrayBuffer())); await py.runPythonAsync(\"from fontTools.ttLib import TTFont as _T\\n_f=_T('/tmp/ng.woff'); _f.flavor=None; _f.save('/tmp/NanumGothic.ttf')\\nfrom matplotlib import font_manager as _fm\\n_fm.fontManager.addfont('/tmp/NanumGothic.ttf')\\n\"); self.cnFont=true; } }catch(_){ } }",
    "    if(mpl&&self.cnFont){ await py.runPythonAsync(\"import matplotlib\\nmatplotlib.rcParams['font.family']=['NanumGothic','DejaVu Sans']\\nmatplotlib.rcParams['axes.unicode_minus']=False\\n\"); }",
    "    if(mpl){ await py.runPythonAsync(\"import matplotlib\\nmatplotlib.use('Agg')\\nimport matplotlib.pyplot as _cn_plt, io as _cn_io, base64 as _cn_b64\\nfrom js import cnImage as _cn_img\\ndef _cn_show(*a, **k):\\n    for n in list(_cn_plt.get_fignums()):\\n        f = _cn_plt.figure(n)\\n        b = _cn_io.BytesIO()\\n        f.savefig(b, format='png', dpi=110, bbox_inches='tight')\\n        _cn_img(_cn_b64.b64encode(b.getvalue()).decode())\\n    _cn_plt.close('all')\\n_cn_plt.close('all')\\n_cn_plt.show = _cn_show\\n_cn_plt.pause = lambda *a, **k: None\\n\", {globals:ns}); }",
    "    postMessage({type:'status',text:'실행 중…'});",
    "    await py.runPythonAsync(m.code,{globals:ns, filename:'<학생 코드>'});",
    "    if(mpl){ await py.runPythonAsync('_cn_show()',{globals:ns}); }",
    "    postMessage({type:'done',ok:true,ms:Date.now()-t0});",
    "  }catch(err){",
    "    postMessage({type:'err',text:String(err&&err.message||err)});",
    "    postMessage({type:'done',ok:false,ms:Date.now()-t0});",
    "  }finally{ if(ns){ try{ ns.destroy(); }catch(_){} } }",
    "};"
  ].join('\n');

  // 아이패드 '스마트 구두점'이 바꾼 따옴표·공백을 되돌림 (파이썬 오류의 흔한 원인)
  const fixSmart = s => String(s).replace(/[‘’‚′]/g, "'").replace(/[“”„″]/g, '"').replace(/ /g, ' ').replace(/\r\n?/g, '\n');
  const kindOf = name => /\.html?$/i.test(name || '') ? 'HTML' : /\.py$/i.test(name || '') ? 'Python' : null;
  const guessKind = code => /^\s*(<!doctype|<html|<head|<body|<script|<div|<canvas|<svg|<style)/i.test(code) ? 'HTML' : 'Python';
  function textToDataURL(text, type){
    const bytes = new TextEncoder().encode(text); let bin = '';
    for(let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return 'data:' + type + ';base64,' + btoa(bin);
  }
  function dataURLToText(d){
    const i = String(d).indexOf(','); if(i < 0) return '';
    const head = d.slice(0, i), body = d.slice(i + 1);
    if(!/;base64/i.test(head)) return decodeURIComponent(body);
    const bin = atob(body), bytes = new Uint8Array(bin.length);
    for(let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
    return new TextDecoder().decode(bytes);
  }

  let el = null, o = null, prevOverflow = '', worker = null, workerReady = false, running = false, outChars = 0, figCount = 0, lastFocus = null, tab = 'code', savedCode = '';
  const $s = id => document.getElementById(id);
  const btn = 'px-3 py-2 text-sm font-semibold rounded-2xl active:scale-95 transition-all duration-200';

  function build(){
    el = document.createElement('div');
    el.id = 'simOv'; el.hidden = true;
    el.className = 'fixed inset-0 z-50 bg-slate-900/60 flex items-stretch justify-center sm:p-4';
    el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'soTitle');
    el.innerHTML = `
    <div class="bg-white w-full max-w-6xl flex flex-col sm:rounded-2xl overflow-hidden shadow-xl">
      <div class="px-4 py-3 border-b border-slate-200 flex flex-wrap items-center gap-2">
        <div class="flex-1 min-w-0">
          <p id="soTitle" class="font-bold truncate">시뮬레이션</p>
          <p id="soStatus" class="text-xs text-slate-500 truncate" role="status"></p>
        </div>
        <button id="soRun" type="button" class="${btn} bg-mint-500 text-white">▶ 실행</button>
        <button id="soStop" type="button" class="${btn} bg-rose-500 text-white" hidden>■ 멈춤</button>
        <button id="soSave" type="button" class="${btn} bg-slate-800 text-white" hidden>팀에 올리기</button>
        <button id="soClose" type="button" class="${btn} bg-white border border-slate-200 text-slate-600">닫기</button>
      </div>
      <div id="soNew" class="px-4 py-3 border-b border-slate-100 grid grid-cols-1 sm:grid-cols-[1fr_auto_auto] gap-2 items-center" hidden>
        <input id="soT" type="text" maxlength="60" autocomplete="off" aria-label="시뮬레이션 제목" placeholder="제목 예) 발사 각도에 따른 포물선 운동" class="fieldbox w-full px-4 py-2.5 rounded-2xl bg-slate-50 text-base">
        <select id="soKind" aria-label="코드 종류" class="fieldbox px-4 py-2.5 rounded-2xl bg-slate-50 text-base"><option value="Python">파이썬</option><option value="HTML">HTML</option></select>
        <label for="soFile" class="${btn} bg-mint-50 text-mint-700 text-center cursor-pointer">파일 열기 (.py .html)</label>
        <input id="soFile" type="file" class="hidden">
      </div>
      <div class="px-4 pt-3 flex gap-1.5" role="tablist">
        <button type="button" role="tab" data-sotab="code" class="${btn}">코드</button>
        <button type="button" role="tab" data-sotab="out" class="${btn}">실행 화면</button>
      </div>
      <div class="flex-1 min-h-0 relative">
        <div id="soCodePane" class="absolute inset-0 flex flex-col p-3 sm:p-4 gap-2 overflow-y-auto">
          <textarea id="soCode" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="코드"
            class="fieldbox flex-1 min-h-[14rem] w-full px-4 py-3 rounded-2xl bg-slate-50 font-mono leading-relaxed whitespace-pre overflow-auto" style="font-size:16px;tab-size:4"
            placeholder="여기에 파이썬 코드나 HTML 코드를 붙여 넣거나, 위의 '파일 열기'로 .py · .html 파일을 고름."></textarea>
          <details id="soStdinBox" class="rounded-2xl bg-slate-50 px-4 py-2"><summary class="text-sm font-semibold text-slate-600 cursor-pointer">input()에 넣을 값 (한 줄에 하나씩)</summary>
            <textarea id="soStdin" rows="3" aria-label="input 값" class="fieldbox mt-2 w-full px-3 py-2 rounded-xl bg-white font-mono" style="font-size:16px"></textarea></details>
          <details class="rounded-2xl px-4 py-1"><summary class="text-xs font-semibold text-slate-500 cursor-pointer">도움말</summary><p class="text-xs text-slate-400 leading-relaxed mt-1">파이썬: print 결과와 matplotlib 그래프(plt.show)를 보여 줌. numpy·matplotlib·pandas·scipy·sympy 사용 가능. 처음 실행은 10~30초 걸림. 애니메이션은 마지막 그림만 나오고 turtle·pygame 창은 열리지 않음.
            HTML: 한 파일 안에 코드가 모두 들어 있어야 함(따로 있는 css·js·그림 파일은 안 불러짐). 끝없이 도는 HTML 코드는 화면을 멈추게 할 수 있음 — 그때는 브라우저를 새로 고침.</p></details>
        </div>
        <div id="soOutPane" class="absolute inset-0 flex flex-col bg-white" hidden>
          <div id="soFrame" class="flex-1 min-h-0" hidden></div>
          <div id="soPy" class="flex-1 min-h-0 overflow-auto p-4" hidden>
            <pre id="soConsole" class="font-mono text-sm whitespace-pre-wrap break-words leading-relaxed"></pre>
            <div id="soFigs" class="mt-3 space-y-3"></div>
          </div>
        </div>
      </div>
    </div>`;
    document.body.appendChild(el);
    const st = document.createElement('style'); st.textContent = '@media print{#simOv{display:none !important}}'; document.head.appendChild(st);
    $s('soRun').addEventListener('click', run);
    $s('soStop').addEventListener('click', stopPython);
    $s('soClose').addEventListener('click', close);
    $s('soSave').addEventListener('click', save);
    $s('soCode').addEventListener('input', dirtyCheck);
    $s('soKind').addEventListener('change', () => { setKind($s('soKind').value); });
    $s('soFile').addEventListener('change', e => { loadFile(e.target.files && e.target.files[0]); e.target.value = ''; });
    el.querySelectorAll('[data-sotab]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.sotab)));
    $s('soCode').addEventListener('keydown', e => {
      if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); run(); return; }
      if(e.key === 'Tab' && !e.shiftKey && !e.altKey && !e.ctrlKey && !e.metaKey){
        e.preventDefault(); const t = e.target, a = t.selectionStart, b = t.selectionEnd;
        t.value = t.value.slice(0, a) + '    ' + t.value.slice(b); t.selectionStart = t.selectionEnd = a + 4; dirtyCheck();
      }
    });
    document.addEventListener('keydown', e => { if(e.key === 'Escape' && el && !el.hidden) close(); });
  }

  function status(t, kind){ const s = $s('soStatus'); s.textContent = t || ''; s.className = 'text-xs truncate ' + (kind === 'err' ? 'text-rose-600' : kind === 'ok' ? 'text-mint-700' : 'text-slate-500'); }
  function showTab(t){
    tab = t;
    $s('soCodePane').hidden = t !== 'code'; $s('soOutPane').hidden = t !== 'out';
    el.querySelectorAll('[data-sotab]').forEach(b => {
      const on = b.dataset.sotab === t; b.setAttribute('aria-selected', on);
      b.className = `${btn} ${on ? 'bg-slate-800 text-white' : 'bg-white text-slate-500 border border-slate-200'}`;
    });
  }
  function setKind(k){
    o.kind = k; $s('soKind').value = k;
    $s('soStdinBox').hidden = k !== 'Python';
    $s('soFrame').hidden = k !== 'HTML'; $s('soPy').hidden = k !== 'Python';
  }
  function dirtyCheck(){
    if(!o) return;
    const b = $s('soSave');
    if(o.mode === 'new'){ b.hidden = false; b.textContent = '팀에 올리기'; return; }
    b.hidden = !(o.canSave && $s('soCode').value !== savedCode);
    b.textContent = '고친 코드 팀에 저장';
  }

  /* ---------- 파이썬 ---------- */
  function newWorker(){
    const w = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], {type:'text/javascript'})));
    workerReady = false; w.onmessage = onWorker;
    w.onerror = e => { finish(); status('파이썬을 시작하지 못했음. 인터넷 연결을 확인할 것. ' + (e.message || ''), 'err'); };
    return w;
  }
  function onWorker(e){
    const m = e.data;
    if(m.type === 'ready'){ workerReady = true; return; }
    if(m.type === 'status'){ if(running) status(m.text); return; }
    if(m.type === 'out'){ out(m.text + '\n', ''); return; }
    if(m.type === 'err'){ out(cleanErr(m.text) + '\n', 'e'); return; }
    if(m.type === 'img'){ fig(m.data); return; }
    if(m.type === 'fatal'){ finish(); status('파이썬을 불러오지 못했음. 인터넷 연결을 확인하고 다시 실행할 것.', 'err'); try{ worker.terminate(); }catch(_){} worker = null; return; }
    if(m.type === 'done'){
      finish(); status(m.ok ? ('실행 끝 · ' + (m.ms/1000).toFixed(1) + '초') : '오류로 멈췄음. 빨간 글씨의 마지막 줄을 확인할 것.', m.ok ? 'ok' : 'err');
      // 한 번 쓴 파이썬은 버리고 새것을 미리 준비함: 이번 실행이 바꾼 것이 다음 실행에 남지 않게
      killWorker(); if(o && o.kind === 'Python') warm();
    }
  }
  function cleanErr(t){
    const keep = []; let skip = false;
    String(t).split('\n').forEach(l => {
      if(/File "\/lib\/python[^"]*_pyodide|File "\/lib\/python[^"]*pyodide\//.test(l)){ skip = true; return; }
      if(skip && /^\s{4}/.test(l)) return;
      skip = false; keep.push(l);
    });
    return keep.join('\n').replace(/\n+$/, '');
  }
  function out(text, cls){
    if(outChars > MAX_OUT) return;
    outChars += text.length;
    if(outChars > MAX_OUT){ text = '\n… 출력이 너무 길어 여기까지만 보여 줌\n'; cls = 'n'; }
    const sp = document.createElement('span'); if(cls === 'e') sp.className = 'text-rose-600'; else if(cls === 'n') sp.className = 'text-slate-400';
    sp.textContent = text; $s('soConsole').appendChild(sp);
    const box = $s('soPy'); box.scrollTop = box.scrollHeight;
  }
  function fig(b64){
    figCount++;
    if(figCount > MAX_FIGS){ if(figCount === MAX_FIGS + 1) out('… 그림이 너무 많아 ' + MAX_FIGS + '장까지만 보여 줌\n', 'n'); return; }
    const img = document.createElement('img'); img.alt = '그래프 ' + figCount; img.className = 'max-w-full rounded-xl border border-slate-100'; img.src = 'data:image/png;base64,' + b64;
    $s('soFigs').appendChild(img);
  }
  function finish(){ running = false; $s('soRun').disabled = false; $s('soStop').hidden = true; }
  function stopPython(){
    if(!running) return;
    if(worker){ worker.terminate(); worker = null; }
    finish(); out('\n■ 멈춤을 눌러 실행을 중단했음\n', 'n'); status('멈췄음. 다시 실행하면 파이썬을 새로 준비함.');
  }

  /* ---------- 실행 ---------- */
  function run(){
    if(!o) return;
    let code = $s('soCode').value;
    if(!code.trim()){ status('코드를 먼저 넣어 주세요.', 'err'); showTab('code'); return; }
    if(o.kind === 'Python'){
      const fixed = fixSmart(code);
      if(fixed !== code.replace(/\r\n?/g, '\n')){ $s('soCode').value = fixed; dirtyCheck(); }
      code = fixed;
      showTab('out');
      $s('soConsole').textContent = ''; $s('soFigs').textContent = ''; outChars = 0; figCount = 0;
      if(!worker) worker = newWorker();
      running = true; $s('soRun').disabled = true; $s('soStop').hidden = false;
      status(workerReady ? '실행 중…' : '파이썬 준비 중… (처음 한 번은 10~30초)');
      worker.postMessage({type:'run', code, stdin: fixSmart($s('soStdin').value)});
    } else {
      showTab('out');
      const wrap = $s('soFrame'); wrap.textContent = '';
      const f = document.createElement('iframe');
      f.title = 'HTML 실행 화면'; f.className = 'w-full h-full border-0 bg-white';
      // allow-same-origin 을 주지 않음: 올린 코드가 이 앱의 로그인 정보에 손댈 수 없음
      f.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals allow-pointer-lock allow-downloads');
      f.setAttribute('allow', 'fullscreen; accelerometer; gyroscope');
      f.srcdoc = code.replace(/\r\n?/g, '\n');
      wrap.appendChild(f);
      status('실행 중. 코드를 고친 뒤 다시 실행을 누르면 새로 고침.', 'ok');
    }
  }

  function loadFile(f){
    if(!f || !o) return;
    if(f.size > MAX_CODE){ status('파일이 너무 큼 (1.5MB까지).', 'err'); return; }
    const k = kindOf(f.name);
    const r = new FileReader();
    r.onload = () => {
      const text = String(r.result || '');
      $s('soCode').value = text;
      setKind(k || guessKind(text));
      o.fname = f.name;
      if(o.mode === 'new' && !$s('soT').value.trim()) $s('soT').value = f.name.replace(/\.[^.]+$/, '').slice(0, 60);
      dirtyCheck(); status(f.name + '을(를) 불러왔음. 실행을 눌러 확인한 뒤 팀에 올릴 것.');
      showTab('code');
    };
    r.onerror = () => status('파일을 읽지 못했음.', 'err');
    r.readAsText(f, 'utf-8');
  }

  async function save(){
    if(!o) return;
    let code = $s('soCode').value;
    if(!code.trim()){ status('코드를 먼저 넣어 주세요.', 'err'); return; }
    if(o.kind === 'Python') code = fixSmart(code); else code = code.replace(/\r\n?/g, '\n');
    if(new Blob([code]).size > MAX_CODE){ status('코드가 너무 김 (1.5MB까지).', 'err'); return; }
    const b = $s('soSave'); b.disabled = true; status('팀에 올리는 중…');
    try{
      if(o.mode === 'new'){
        const title = $s('soT').value.trim();
        if(!title){ status('제목을 적어 주세요.', 'err'); $s('soT').focus(); return; }
        const fname = o.fname || (title.replace(/[\\/:*?"<>|]/g, '').slice(0, 40) || 'simulation') + (o.kind === 'HTML' ? '.html' : '.py');
        const r = await o.onUpload({title, kind:o.kind, code, fname});
        if(!r || !r.ok){ status((r && r.msg) || '올리지 못했음. 다시 시도할 것.', 'err'); return; }
        // 올린 뒤에는 '보기' 상태로 바뀜 (고치면 다시 저장 가능)
        o.mode = 'view'; o.rowId = r.rowId; o.onSave = r.onSave; o.canSave = !!r.onSave;
        $s('soNew').hidden = true; $s('soTitle').textContent = `${title} · ${o.kind === 'HTML' ? 'HTML' : '파이썬'}`;
        savedCode = code; $s('soCode').value = code; dirtyCheck();
        status('팀에 올렸음. 닫은 뒤 카드의 설명 칸도 채울 것.', 'ok');
      } else {
        const r = await o.onSave(code);
        if(!r || !r.ok){ status((r && r.msg) || '저장하지 못했음. 다시 시도할 것.', 'err'); return; }
        savedCode = code; $s('soCode').value = code; dirtyCheck(); status('고친 코드를 팀에 저장했음.', 'ok');
      }
    }catch(e){ status('올리지 못했음. 인터넷 연결을 확인할 것.', 'err'); }
    finally{ b.disabled = false; }
  }

  // opts: {mode:'new'|'view', title, kind, canSave, load:async()=>code, onSave:async(code)=>{ok,msg}, onUpload:async({title,kind,code,fname})=>{ok,msg,rowId,onSave}, autorun, startTab}
  async function open(opts){
    if(!el) build();
    if(running) stopPython();
    killWorker();   // 열 때마다 새 파이썬: 앞 시뮬레이션이 바꿔 놓은 것이 남지 않게
    o = Object.assign({kind:'Python'}, opts);
    lastFocus = document.activeElement;
    if(el.hidden) prevOverflow = document.body.style.overflow;
    el.hidden = false; document.body.style.overflow = 'hidden';
    $s('soFrame').textContent = ''; $s('soConsole').textContent = ''; $s('soFigs').textContent = ''; $s('soStdin').value = '';
    $s('soNew').hidden = o.mode !== 'new';
    $s('soTitle').textContent = o.mode === 'new' ? '새 시뮬레이션 올리기' : `${o.title || '시뮬레이션'} · ${o.kind === 'HTML' ? 'HTML' : '파이썬'}`;
    $s('soCode').readOnly = o.mode !== 'new' && !o.canSave;
    setKind(o.kind); showTab(o.startTab || 'code');
    savedCode = ''; $s('soCode').value = ''; $s('soT').value = ''; o.fname = o.fname || '';
    dirtyCheck();
    if(o.mode === 'new'){ status('코드를 붙여 넣거나 파일을 열고, 실행으로 확인한 뒤 팀에 올림.'); $s('soT').focus(); warm(); return; }
    status('코드를 불러오는 중…'); $s('soRun').disabled = true;
    try{
      const code = await o.load();
      if(!el || el.hidden) return;
      savedCode = code; $s('soCode').value = code; dirtyCheck(); $s('soRun').disabled = false;
      status(o.canSave ? '코드를 고친 뒤 실행해 보고, 괜찮으면 저장을 누름.' : '');
      if(o.autorun) run(); else if(o.kind === 'Python') warm();
    }catch(e){ $s('soRun').disabled = false; status((e && e.msg) || '코드를 불러오지 못했음. 다시 열어 볼 것.', 'err'); }
    $s('soClose').focus();
  }
  function killWorker(){ if(worker){ try{ worker.terminate(); }catch(_){} worker = null; workerReady = false; } }
  function warm(){ if(!worker && o && o.kind === 'Python'){ worker = newWorker(); worker.postMessage({type:'warm'}); } }
  function close(){
    if(!el || el.hidden) return;
    if(o && o.mode === 'view' && o.canSave && $s('soCode').value !== savedCode && !confirm('저장하지 않은 코드 수정이 있음. 그래도 닫을까요?')) return;
    if(o && o.mode === 'new' && $s('soCode').value.trim() && !confirm('아직 팀에 올리지 않았음. 그래도 닫을까요?')) return;
    if(running) stopPython();
    killWorker();
    $s('soFrame').textContent = '';   // 애니메이션 멈춤
    el.hidden = true; document.body.style.overflow = prevOverflow; o = null;
    if(lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
  }
  const isOpen = () => !!(el && !el.hidden);
  return {open, close, isOpen, textToDataURL, dataURLToText};
})();

function rpc(fn, args){
  return fetch(API_URL + '/rest/v1/rpc/' + fn, {
    method:'POST', headers:{'Content-Type':'application/json','apikey':API_KEY},
    body: JSON.stringify(args), cache:'no-store'
  }).then(r => {
    if(!r.ok){ const e = new Error('http '+r.status); e.code = 'network'; throw e; }
    return r.json();
  }, () => { const e = new Error('offline'); e.code = 'network'; throw e; });
}

function filled(v){   // 학생용과 같아야 함
  if(Array.isArray(v)) return v.some(x => (x && typeof x === 'object') ? Object.keys(x).some(k => k !== '_id' && String(x[k]||'').trim() !== '') : String(x||'').trim() !== '');
  if(v && typeof v === 'object') return Object.keys(v).some(k => k !== '_id' && String(v[k]||'').trim() !== '');
  return !!(v && String(v).trim() !== '');
}
function visible(f, sec, cells){
  if(!f.when) return true;
  const v = cells[sec.id + '.' + f.when[0]];
  return Array.isArray(v) && v.includes(f.when[1]);
}
// 학생용 counts()와 같아야 함
function counts(f, sec, cells){
  if(f.noProgress) return false;
  if(!visible(f, sec, cells)) return false;
  if(f.countWhen){ const v = cells[f.countWhen[0]]; if(!(Array.isArray(v) && v.includes(f.countWhen[1]))) return false; }
  return true;
}
function progress(cells){
  let total = 0, done = 0;
  SECTIONS.forEach(sec => sec.fields.forEach(f => { if(!counts(f, sec, cells)) return; total++; if(filled(cells[sec.id+'.'+f.k])) done++; }));
  return total ? Math.round(done/total*100) : 0;
}
function leaderOf(c){ const l = c['team.leader']; return l && typeof l === 'object' ? [l.id, l.n].filter(Boolean).join(' ') : ''; }
function headcount(c){ const m = Array.isArray(c['team.members']) ? c['team.members'].filter(filled).length : 0; return m + (leaderOf(c) ? 1 : 0); }
function fmtTime(ms){ if(!ms) return '—'; return new Date(Number(ms)).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function ago(ms){
  if(!ms) return '아직 없음';
  const d = (Date.now() - Number(ms))/60000;
  if(d < 1) return '방금'; if(d < 60) return Math.floor(d)+'분 전';
  if(d < 1440) return Math.floor(d/60)+'시간 전'; return Math.floor(d/1440)+'일 전';
}
function weekLabel(w){ const m = new Date(w+'T00:00:00Z'); const e = new Date(m.getTime()+6*86400e3); const f = x => `${x.getUTCMonth()+1}/${x.getUTCDate()}`; return `${f(m)}~${f(e)}`; }
function weeksBack(cur, n){ const out = []; const m = new Date(cur+'T00:00:00Z'); for(let i=0;i<n;i++){ out.push(new Date(m.getTime() - i*7*86400e3).toISOString().slice(0,10)); } return out; }

const simCache = {};
$('dPrint').addEventListener('click', () => window.print());

/* 첨부: 누르면 받아 온 뒤 '열기' 링크로 바뀜 (아이패드는 비동기 뒤 새 창을 막기 때문) */
const blobURLs = {};
const SAFE_VIEW = /^(image\/(jpeg|png|gif|webp|heic|heif)|application\/pdf|text\/plain|audio\/|video\/)/i;   // 나머지(html·svg 등)는 실행되지 않게 받기로만
function secTitle(id){ const s = SECTIONS.find(x => x.id === id); return s ? `${s.num}. ${s.tab}` : id; }
function renderFiles(t){
  const ul = $('dFiles');
  const list = t.files.filter(f => f.sec !== 'simcode');   // 시뮬레이션 코드는 워크시트의 '5+ 시뮬레이션'에서 실행
  if(!list.length){ ul.innerHTML = '<li class="text-slate-400">첨부가 없음.</li>'; return; }
  ul.innerHTML = list.map(f => `<li class="flex items-center justify-between gap-2 bg-slate-50 rounded-xl px-3 py-2">
    <span class="min-w-0 truncate"><span class="text-xs text-slate-400 mr-1">${esc(secTitle(f.sec))}</span>${esc(f.name)} <span class="text-xs text-slate-400">${Math.max(1, Math.round(f.size/1024))}KB</span></span>
    <span data-fwrap="${f.id}">${blobURLs[f.id] ? `<a href="${blobURLs[f.id]}" target="_blank" rel="noopener"${SAFE_VIEW.test(f.type||'')?'':` download="${esc(f.name)}"`} class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-mint-500 text-white">열기</a>` : `<button type="button" data-file="${f.id}" class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-white border border-slate-200">준비</button>`}</span>
  </li>`).join('');
}
$('dFiles').addEventListener('click', async e => {
  const b = e.target.closest('button[data-file]'); if(!b) return;
  b.disabled = true; b.textContent = '받는 중…';
  try{
    const r = await rpc('ws_t_file_get', {p_key: KEY, p_id: b.dataset.file});
    if(!r || !r.ok) throw new Error('x');
    const blob = await (await fetch(r.data)).blob();
    blobURLs[b.dataset.file] = URL.createObjectURL(new Blob([blob], {type: SAFE_VIEW.test(r.type||'') ? r.type : 'application/octet-stream'}));
    const t = DATA.teams.find(x => x.id === openTeam); if(t) renderFiles(t);
  }catch(err){ b.disabled = false; b.textContent = '다시'; }
});

/* 비밀번호 새로 정하기 */
$('dPwBtn').addEventListener('click', async () => {
  const pw = $('dPw').value, msg = $('dPwMsg'), btn = $('dPwBtn');
  if(pw.length < 4 || pw.length > 40){ msg.textContent = '4~40자로 적을 것.'; msg.className = 'text-sm mt-2 text-rose-600'; return; }
  const t = DATA.teams.find(x => x.id === openTeam); if(!t) return;
  if(btn.dataset.confirm !== t.id){ btn.dataset.confirm = t.id; btn.textContent = '한 번 더 누르면 바뀜'; msg.textContent = `${t.class}반 ${t.name} 비밀번호를 “${pw}”(으)로 바꿈.`; msg.className = 'text-sm mt-2 text-amber-700'; return; }
  btn.disabled = true;
  try{
    const r = await rpc('ws_t_reset_pw', {p_key: KEY, p_team: t.id, p_pw: pw});
    if(!r || !r.ok) throw new Error(r && r.error);
    msg.textContent = `바꿨음. 학생들에게 새 비밀번호 “${pw}”를 알려 줄 것.`; msg.className = 'text-sm mt-2 text-mint-700 font-semibold';
    $('dPw').value = '';
  }catch(e){ msg.textContent = '바꾸지 못했음. 다시 시도할 것.'; msg.className = 'text-sm mt-2 text-rose-600'; }
  finally{ btn.disabled = false; btn.textContent = '바꾸기'; delete btn.dataset.confirm; }
});
$('dPw').addEventListener('input', () => { const b = $('dPwBtn'); delete b.dataset.confirm; b.textContent = '바꾸기'; });

/* ---------- CSV ---------- */
$('btnCsv').addEventListener('click', () => {
  if(!DATA) return;
  const w = $('fWeek').value;
  const q = s => { let t = String(s==null?'':s); if(/^[=+\-@\t\r]/.test(t)) t = "'" + t; return `"${t.replace(/"/g,'""')}"`; };   // 엑셀 수식 실행 막기
  const lines = [['반','팀','팀장','인원','진행률(%)','마지막 수정','제출','제출 시각','제출자','이번 주 한 것'].map(q).join(',')];
  teamsShown().forEach(t => { const s = lastSubOfWeek(t, w);
    lines.push([t.class, t.name, leaderOf(t.cells), headcount(t.cells), progress(t.cells), t.last ? fmtTime(t.last) : '', s ? 'O' : 'X', s ? fmtTime(s.at) : '', s ? s.submitter : '', s ? s.note : ''].map(q).join(',')); });
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `워크시트_제출현황_${w}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
});

/* ---------- 열쇠 ---------- */
function banner(text, kind){ const b = $('banner'); b.textContent = text; b.className = 'rounded-2xl p-4 text-sm font-semibold ' + (kind === 'bad' ? 'bg-rose-50 text-rose-700' : 'bg-amber-50 text-amber-800'); }
function hideBanner(){ $('banner').className = 'hidden'; }
function lock(msg){
  KEY = null; DATA = null; clearTimeout(timer); lsDel('ws_tkey'); closeDetail();
  $('app').hidden = true; $('gate').hidden = false; $('gKey').value = '';
  $('gMsg').textContent = msg || ''; $('gMsg').className = 'text-sm ' + (msg ? 'text-rose-600' : 'text-slate-500');
}
$('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const k = $('gKey').value.trim(); if(!k) return;
  $('gMsg').textContent = '확인하는 중…'; $('gMsg').className = 'text-sm text-slate-500';
  KEY = k;
  const ok = await load(false);
  if(ok){ if($('gRemember').checked) lsSet('ws_tkey', k); $('gate').hidden = true; $('app').hidden = false; }
  else if(KEY){ $('gMsg').textContent = '서버에 연결하지 못했음. 인터넷 연결을 확인할 것.'; $('gMsg').className = 'text-sm text-rose-600'; KEY = null; clearTimeout(timer); }
});
$('btnOut').addEventListener('click', () => lock(''));
$('btnRefresh').addEventListener('click', () => load(false));
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && KEY) load(true); });

(async function init(){
  const k = lsGet('ws_tkey');
  if(k){ KEY = k; $('gate').hidden = true; $('app').hidden = false; $('stamp').textContent = '불러오는 중…'; const ok = await load(false); if(!ok && KEY){ /* 연결 문제면 화면 유지 */ } }
})();
</script>
