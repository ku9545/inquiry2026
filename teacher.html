<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>워크시트 교사용</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { mint: { 50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',400:'#34d399',500:'#10B981',600:'#059669',700:'#047857',800:'#065f46' } },
  fontFamily: { sans: ['Pretendard','sans-serif'] } } } }
</script>
<style>
  body { background:#F8FAFC; font-family:'Pretendard',sans-serif; }
  input, select, textarea { font-size:16px; }
  .fieldbox:focus { outline:none; box-shadow:0 0 0 3px rgba(16,185,129,.18); }
  button:focus-visible, a:focus-visible, select:focus-visible { outline:2px solid #059669; outline-offset:2px; }
  [hidden] { display:none !important; }
  .grid-cell { min-width:44px; }
  @media print {
    .no-print { display:none !important; } body { background:#fff; }
    body.detail-open #app { display:none !important; }
    #detailWrap { position:static !important; display:block !important; background:none !important; }
    #detail { position:static !important; height:auto !important; max-width:none !important; overflow:visible !important; box-shadow:none !important; }
    #detail .sticky { position:static !important; }
    section { break-inside:avoid; }
  }

</head>
<body class="text-slate-800">

<!-- 열쇠 입력 -->
<section id="gate" class="max-w-md mx-auto px-4 py-12">
  <div class="bg-white rounded-2xl shadow-md p-6 sm:p-8">
    <h1 class="text-xl font-bold tracking-tight">워크시트 교사용 화면</h1>
    <p class="text-sm text-slate-500 mt-1.5 leading-relaxed">교사 열쇠를 넣으면 모든 반·팀의 워크시트와 주간 제출을 볼 수 있음.</p>
    <form id="gateForm" class="mt-6 space-y-4" autocomplete="off">
      <div>
        <label for="gKey" class="block text-sm font-bold mb-1.5">교사 열쇠</label>
        <input id="gKey" type="password" autocomplete="off" class="fieldbox w-full px-4 py-2.5 rounded-2xl bg-slate-50 text-base">
      </div>
      <label for="gRemember" class="flex items-center gap-2 text-sm text-slate-500"><input id="gRemember" type="checkbox" class="w-5 h-5"> 이 기기에서 기억하기 (교사 개인 기기에서만)</label>
      <button type="submit" class="w-full px-4 py-3 text-base font-semibold rounded-2xl bg-mint-500 text-white shadow-sm hover:bg-mint-600 active:scale-95 transition-all duration-200">열기</button>
      <p id="gMsg" class="text-sm text-slate-500" role="status"></p>
    </form>
  </div>
</section>

<div id="app" hidden>
  <header class="sticky top-0 z-20 bg-[#F8FAFC]/90 backdrop-blur border-b border-slate-200/60 no-print">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center gap-3 justify-between">
      <div>
        <h1 class="text-lg sm:text-xl font-bold tracking-tight">워크시트 교사용</h1>
        <p id="stamp" class="text-xs text-slate-400 mt-0.5">—</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <select id="fClass" class="fieldbox px-3 py-2 rounded-2xl bg-white shadow-sm text-sm" aria-label="반">
          <option value="">전체 반</option>
          <option value="1">1반</option><option value="2">2반</option><option value="3">3반</option><option value="4">4반</option>
          <option value="5">5반</option><option value="6">6반</option><option value="7">7반</option><option value="8">8반</option>
        </select>
        <select id="fWeek" class="fieldbox px-3 py-2 rounded-2xl bg-white shadow-sm text-sm" aria-label="주"></select>
        <button id="btnRefresh" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-white text-slate-700 shadow-sm active:scale-95 transition-all duration-200">새로 고침</button>
        <button id="btnCsv" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-white text-slate-700 shadow-sm active:scale-95 transition-all duration-200">제출 현황 CSV</button>
        <button id="btnOut" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-white text-slate-500 shadow-sm active:scale-95 transition-all duration-200">잠그기</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 pb-24 space-y-6">
    <div id="banner" class="hidden rounded-2xl p-4 text-sm font-semibold" role="status"></div>

    <!-- 요약 -->
    <section id="summary" class="grid grid-cols-2 sm:grid-cols-4 gap-3 no-print"></section>

    <!-- 팀 목록 -->
    <section id="list" class="bg-white rounded-2xl shadow-sm overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-2 flex-wrap">
        <h2 class="font-bold">팀별 현황</h2>
        <p class="text-xs text-slate-400">팀을 누르면 워크시트를 볼 수 있음</p>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-left text-slate-500 bg-slate-50">
            <tr><th class="px-4 py-2.5 font-semibold">반</th><th class="px-4 py-2.5 font-semibold">팀</th><th class="px-4 py-2.5 font-semibold">팀장</th><th class="px-4 py-2.5 font-semibold">인원</th><th class="px-4 py-2.5 font-semibold w-40">진행률</th><th class="px-4 py-2.5 font-semibold">마지막 수정</th><th class="px-4 py-2.5 font-semibold" id="thWeek">이번 주 제출</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <!-- 주간 제출 표 -->
    <section id="grid" class="bg-white rounded-2xl shadow-sm overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100"><h2 class="font-bold">주별 제출 기록</h2><p class="text-xs text-slate-400 mt-0.5">● 제출함 · ○ 안 함 — 칸을 누르면 그 주 제출본을 봄</p></div>
      <div class="overflow-x-auto"><table class="text-sm" id="gridTable"></table></div>
    </section>
  </main>
</div>

<!-- 팀 상세 -->
<div id="detailWrap" hidden class="fixed inset-0 z-40 bg-slate-900/40 flex justify-end">
  <aside id="detail" class="bg-[#F8FAFC] w-full max-w-3xl h-full overflow-auto shadow-xl" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="sticky top-0 z-10 bg-white border-b border-slate-200 px-5 py-4 flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h2 id="dTitle" class="text-lg font-bold truncate">—</h2>
        <p id="dSub" class="text-xs text-slate-500 mt-0.5">—</p>
      </div>
      <div class="flex gap-2 no-print">
        <button id="dPrint" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-white border border-slate-200 text-slate-700 active:scale-95 transition-all duration-200">인쇄</button>
        <button id="dClose" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-slate-800 text-white active:scale-95 transition-all duration-200">닫기</button>
      </div>
    </div>
    <div class="px-5 py-5 space-y-5">
      <div id="dViewBar" class="flex flex-wrap gap-2 no-print"></div>
      <div id="dNote" class="hidden rounded-2xl bg-mint-50 text-mint-700 p-4 text-sm"></div>
      <div id="dBody" class="space-y-4"></div>
      <section class="bg-white rounded-2xl shadow-sm p-5 no-print">
        <h3 class="font-bold">첨부 파일</h3>
        <ul id="dFiles" class="mt-3 space-y-2 text-sm"></ul>
      </section>
      <section class="bg-white rounded-2xl shadow-sm p-5 no-print">
        <h3 class="font-bold">팀 비밀번호 새로 정하기</h3>
        <p class="text-xs text-slate-500 mt-1 leading-relaxed">학생들이 비밀번호를 잊었을 때 씀. 바꾸면 그 팀의 모든 기기가 나가지고, 새 비밀번호로 다시 들어가야 함. 잠김도 풀림.</p>
        <div class="mt-3 flex gap-2">
          <input id="dPw" type="text" maxlength="40" autocomplete="off" class="fieldbox flex-1 px-4 py-2.5 rounded-2xl bg-slate-50 text-base" placeholder="새 비밀번호 (4자 이상)">
          <button id="dPwBtn" type="button" class="px-4 py-2.5 text-sm font-semibold rounded-2xl bg-rose-500 text-white active:scale-95 transition-all duration-200">바꾸기</button>
        </div>
        <p id="dPwMsg" class="text-sm mt-2" role="status"></p>
      </section>
    </div>
  </aside>
</div>

    body: JSON.stringify(args), cache:'no-store'
  }).then(r => {
    if(!r.ok){ const e = new Error('http '+r.status); e.code = 'network'; throw e; }
    return r.json();
  }, () => { const e = new Error('offline'); e.code = 'network'; throw e; });
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

let KEY = null, DATA = null, timer = null, openTeam = null, view = 'now';

/* ---------- 계산 ---------- */
function filled(v){   // 학생용과 같아야 함
  if(Array.isArray(v)) return v.some(x => (x && typeof x === 'object') ? Object.keys(x).some(k => k !== '_id' && String(x[k]||'').trim() !== '') : String(x||'').trim() !== '');
  if(v && typeof v === 'object') return Object.keys(v).some(k => k !== '_id' && String(v[k]||'').trim() !== '');
  return !!(v && String(v).trim() !== '');
}
function visible(f, sec, cells){
  if(!f.when) return true;
  const v = cells[sec.id + '.' + f.when[0]];
  return Array.isArray(v) && v.includes(f.when[1]);
}
function progress(cells){
  let total = 0, done = 0;
  SECTIONS.forEach(sec => sec.fields.forEach(f => { if(!visible(f, sec, cells)) return; total++; if(filled(cells[sec.id+'.'+f.k])) done++; }));
  return total ? Math.round(done/total*100) : 0;
}
function leaderOf(c){ const l = c['team.leader']; return l && typeof l === 'object' ? [l.id, l.n].filter(Boolean).join(' ') : ''; }
function headcount(c){ const m = Array.isArray(c['team.members']) ? c['team.members'].filter(filled).length : 0; return m + (leaderOf(c) ? 1 : 0); }
function fmtTime(ms){ if(!ms) return '—'; return new Date(Number(ms)).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function ago(ms){
  if(!ms) return '아직 없음';
  const d = (Date.now() - Number(ms))/60000;
  if(d < 1) return '방금'; if(d < 60) return Math.floor(d)+'분 전';
  if(d < 1440) return Math.floor(d/60)+'시간 전'; return Math.floor(d/1440)+'일 전';
}
function weekLabel(w){ const m = new Date(w+'T00:00:00Z'); const e = new Date(m.getTime()+6*86400e3); const f = x => `${x.getUTCMonth()+1}/${x.getUTCDate()}`; return `${f(m)}~${f(e)}`; }
function weeksBack(cur, n){ const out = []; const m = new Date(cur+'T00:00:00Z'); for(let i=0;i<n;i++){ out.push(new Date(m.getTime() - i*7*86400e3).toISOString().slice(0,10)); } return out; }
const lastSubOfWeek = (t, w) => t.subs.find(s => s.week === w);   // subs는 최신순

/* ---------- 불러오기 ---------- */
async function load(quiet){
  try{
    const r = await rpc('ws_t_overview', {p_key: KEY});
    if(!r || !r.ok){
      if(r && r.error === 'bad_key'){ lock('교사 열쇠가 맞지 않음.'); return false; }
      throw new Error('x');
    }
    DATA = r; hideBanner();
    $('stamp').textContent = `불러온 시각 ${fmtTime(r.now)} · 1분마다 저절로 새로 고침`;
    buildWeekSelect(); renderAll();
    if(openTeam){ const t = DATA.teams.find(x => x.id === openTeam); if(t && view === 'now') renderDetail(t); }
    return true;
  }catch(e){
    if(!quiet || !DATA) banner('서버에 연결하지 못했음. 인터넷 연결을 확인하고 새로 고침을 누를 것.', 'bad');
    return false;
  }finally{
    clearTimeout(timer); if(KEY) timer = setTimeout(() => load(true), 60000);
  }
}
function buildWeekSelect(){
  const sel = $('fWeek'), keep = sel.value;
  const set = new Set(weeksBack(DATA.week, 8));
  DATA.teams.forEach(t => t.subs.forEach(s => set.add(s.week)));
  const list = [...set].sort().reverse();
  sel.innerHTML = list.map(w => `<option value="${w}">${w === DATA.week ? '이번 주 ' : ''}${weekLabel(w)}</option>`).join('');
  sel.value = list.includes(keep) ? keep : DATA.week;
}
const teamsShown = () => { if(!DATA) return []; const c = $('fClass').value; return DATA.teams.filter(t => !c || String(t.class) === c); };

/* ---------- 목록 ---------- */
function renderAll(){
  if(!DATA) return;
  const w = $('fWeek').value, ts = teamsShown();
  $('thWeek').textContent = (w === DATA.week ? '이번 주' : weekLabel(w)) + ' 제출';
  const sub = ts.filter(t => lastSubOfWeek(t, w)).length;
  const active = ts.filter(t => t.last && Date.now() - t.last < 7*86400e3).length;
  const avg = ts.length ? Math.round(ts.reduce((a,t) => a + progress(t.cells), 0) / ts.length) : 0;
  const card = (label, val, note) => `<div class="bg-white rounded-2xl shadow-sm p-4"><p class="text-xs text-slate-500">${label}</p><p class="text-2xl font-bold mt-1">${val}</p><p class="text-xs text-slate-400 mt-0.5">${note}</p></div>`;
  $('summary').innerHTML =
    card('팀 수', ts.length, $('fClass').value ? $('fClass').value+'반' : '전체 반') +
    card('제출', `${sub}<span class="text-base text-slate-400"> / ${ts.length}</span>`, weekLabel(w) + ' 주') +
    card('미제출', ts.length - sub, '같은 주 기준') +
    card('평균 진행률', avg + '%', `최근 7일 작성 ${active}팀`);

  const rows = $('rows');
  if(!ts.length){ rows.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-slate-400">아직 만들어진 팀이 없음.</td></tr>`; }
  else rows.innerHTML = ts.map(t => {
    const p = progress(t.cells), s = lastSubOfWeek(t, w);
    return `<tr class="border-t border-slate-100 hover:bg-mint-50/50 cursor-pointer" data-team="${t.id}" tabindex="0">
      <td class="px-4 py-3 whitespace-nowrap">${t.class}반</td>
      <td class="px-4 py-3 font-semibold">${esc(t.name)}</td>
      <td class="px-4 py-3 whitespace-nowrap">${esc(leaderOf(t.cells)) || '<span class="text-slate-300">—</span>'}</td>
      <td class="px-4 py-3">${headcount(t.cells) || '—'}</td>
      <td class="px-4 py-3"><div class="flex items-center gap-2"><div class="flex-1 h-2 bg-slate-200 rounded-full overflow-hidden"><div class="h-full bg-mint-500" style="width:${p}%"></div></div><span class="text-xs font-semibold text-mint-600 w-9 text-right">${p}%</span></div></td>
      <td class="px-4 py-3 whitespace-nowrap text-slate-500">${ago(t.last)}</td>
      <td class="px-4 py-3 whitespace-nowrap">${s ? `<span class="text-mint-600 font-semibold">제출함</span> <span class="text-xs text-slate-400">${fmtTime(s.at)} · ${esc(s.submitter)}</span>` : '<span class="text-amber-600 font-semibold">안 함</span>'}</td>
    </tr>`;
  }).join('');

  const weeks = weeksBack(DATA.week, 8).reverse();
  $('gridTable').innerHTML = `<thead class="bg-slate-50 text-slate-500"><tr><th class="px-4 py-2.5 text-left font-semibold whitespace-nowrap">반 · 팀</th>${weeks.map(w => `<th class="grid-cell px-2 py-2.5 font-semibold text-xs whitespace-nowrap">${weekLabel(w)}</th>`).join('')}</tr></thead><tbody>` +
    ts.map(t => `<tr class="border-t border-slate-100"><td class="px-4 py-2 whitespace-nowrap">${t.class}반 · <b>${esc(t.name)}</b></td>${weeks.map(w => {
      const s = lastSubOfWeek(t, w);
      return s ? `<td class="grid-cell text-center"><button type="button" class="text-mint-600 text-lg leading-none px-2 py-1" data-sub="${s.id}" data-team="${t.id}" aria-label="${esc(t.name)} ${weekLabel(w)} 제출본 보기">●</button></td>`
               : `<td class="grid-cell text-center text-slate-300">○</td>`;
    }).join('')}</tr>`).join('') + `</tbody>`;
}
$('rows').addEventListener('click', e => { const tr = e.target.closest('tr[data-team]'); if(tr) openDetail(tr.dataset.team); });
$('rows').addEventListener('keydown', e => { if(e.key === 'Enter'){ const tr = e.target.closest('tr[data-team]'); if(tr) openDetail(tr.dataset.team); } });
$('gridTable').addEventListener('click', e => { const b = e.target.closest('button[data-sub]'); if(b) openDetail(b.dataset.team, b.dataset.sub); });
$('fClass').addEventListener('change', renderAll);
$('fWeek').addEventListener('change', renderAll);

/* ---------- 상세 ---------- */
const filledRow = r => filled([r]);
function sheetHTML(cells){
  return SECTIONS.map(sec => {
    const items = sec.fields.filter(f => visible(f, sec, cells)).map(f => {
      const v = cells[sec.id+'.'+f.k];
      let body;
      if(!filled(v)) body = '<p class="text-slate-300 text-sm">비어 있음</p>';
      else if(f.type === 'checks' && Array.isArray(v)) body = `<p class="text-sm">${v.map(esc).join(' · ')}</p>`;
      else if(Array.isArray(v)) body = `<ol class="list-decimal pl-5 space-y-1.5 text-sm">${v.filter(filledRow).map(row => `<li>${(f.sub||[]).map(s => row && String(row[s.k]||'').trim() ? `<span class="text-slate-500">${esc(s.label)}:</span> <span class="whitespace-pre-wrap">${esc(row[s.k])}</span>` : '').filter(Boolean).join(' <span class="text-slate-300">/</span> ') || '<span class="text-slate-300">빈 줄</span>'}</li>`).join('')}</ol>`;
      else if(typeof v === 'object') body = `<p class="text-sm space-y-0.5">${(f.sub||[]).map(s => String(v[s.k]||'').trim() ? `<span class="text-slate-500">${esc(s.label)}:</span> <span class="whitespace-pre-wrap">${esc(v[s.k])}</span>` : '').filter(Boolean).join('<br>')}</p>`;
      else body = `<p class="text-sm whitespace-pre-wrap leading-relaxed">${esc(v)}</p>`;
      return `<div class="py-2.5 border-t border-slate-100 first:border-0"><p class="text-xs font-bold text-slate-600 mb-1">${esc(f.label)}</p>${body}</div>`;
    }).join('');
    return `<section class="bg-white rounded-2xl shadow-sm p-5"><h3 class="font-bold mb-2"><span class="text-mint-600">${sec.num}.</span> ${esc(sec.title)}</h3>${items}</section>`;
  }).join('');
}
function openDetail(id, subId){
  const t = DATA.teams.find(x => x.id === id); if(!t) return;
  if(!openTeam) lastFocus = document.activeElement;
  openTeam = id; $('dPw').value = ''; $('dPwMsg').textContent = '';
  const pb = $('dPwBtn'); delete pb.dataset.confirm; pb.textContent = '바꾸기';
  $('detailWrap').hidden = false; document.body.style.overflow = 'hidden'; document.body.classList.add('detail-open');
  if(subId) showSub(t, subId); else { view = 'now'; renderDetail(t); }
  $('dClose').focus();
}
function viewBar(t){
  const btn = (v, label) => `<button type="button" data-view="${v}" class="px-3 py-1.5 text-xs font-semibold rounded-2xl ${view === v ? 'bg-slate-800 text-white' : 'bg-white text-slate-600 border border-slate-200'} active:scale-95 transition-all duration-200">${label}</button>`;
  $('dViewBar').innerHTML = btn('now', '지금 워크시트') + t.subs.slice(0, 20).map(s => btn(s.id, `${weekLabel(s.week)} 제출본 · ${fmtTime(s.at)}`)).join('');
}
function renderDetail(t){
  $('dTitle').textContent = `${t.class}반 · ${t.name}`;
  $('dSub').textContent = `진행률 ${progress(t.cells)}% · 마지막 수정 ${ago(t.last)} · 팀장 ${leaderOf(t.cells) || '미기재'}`;
  viewBar(t);
  $('dNote').className = 'hidden';
  $('dBody').innerHTML = sheetHTML(t.cells);
  renderFiles(t);
}
async function showSub(t, subId){
  view = subId; viewBar(t);
  $('dTitle').textContent = `${t.class}반 · ${t.name}`;
  $('dSub').textContent = '제출본을 불러오는 중…'; $('dNote').className = 'hidden'; $('dNote').innerHTML = '';
  $('dBody').innerHTML = '<p class="text-sm text-slate-400">제출본을 불러오는 중…</p>';
  renderFiles(t);
  try{
    const r = await rpc('ws_t_sub_get', {p_key: KEY, p_id: subId});
    if(view !== subId || openTeam !== t.id) return;
    if(!r || !r.ok) throw new Error('x');
    const snap = r.snapshot || {};
    $('dSub').textContent = `${weekLabel(r.week)} 제출본 · ${fmtTime(r.at)} · 제출자 ${r.submitter} · 그때 진행률 ${progress(snap)}%`;
    $('dNote').className = 'rounded-2xl bg-mint-50 text-mint-800 p-4 text-sm';
    $('dNote').innerHTML = `<p class="font-bold mb-1">이번 주 한 것</p><p class="whitespace-pre-wrap leading-relaxed">${esc(r.note)}</p>`;
    $('dBody').innerHTML = sheetHTML(snap);
  }catch(e){ if(view === subId) $('dBody').innerHTML = '<p class="text-sm text-rose-600">제출본을 불러오지 못했음. 다시 눌러 볼 것.</p>'; }
}
$('dViewBar').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]'); if(!b) return;
  const t = DATA.teams.find(x => x.id === openTeam); if(!t) return;
  if(b.dataset.view === 'now'){ view = 'now'; renderDetail(t); } else showSub(t, b.dataset.view);
});
let lastFocus = null;
function closeDetail(){
  const was = openTeam;
  $('detailWrap').hidden = true; document.body.style.overflow = ''; document.body.classList.remove('detail-open'); openTeam = null; view = 'now';
  if(was){ const row = document.querySelector(`#rows tr[data-team="${CSS.escape(was)}"]`); const back = (lastFocus && document.contains(lastFocus)) ? lastFocus : row; if(back && back.focus) back.focus(); }
  lastFocus = null;
}
$('dClose').addEventListener('click', closeDetail);
$('detailWrap').addEventListener('click', e => { if(e.target.id === 'detailWrap') closeDetail(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('detailWrap').hidden) closeDetail(); });
$('dPrint').addEventListener('click', () => window.print());

/* 첨부: 누르면 받아 온 뒤 '열기' 링크로 바뀜 (아이패드는 비동기 뒤 새 창을 막기 때문) */
const blobURLs = {};
const SAFE_VIEW = /^(image\/(jpeg|png|gif|webp|heic|heif)|application\/pdf|text\/plain|audio\/|video\/)/i;   // 나머지(html·svg 등)는 실행되지 않게 받기로만
function secTitle(id){ const s = SECTIONS.find(x => x.id === id); return s ? `${s.num}. ${s.tab}` : id; }
function renderFiles(t){
  const ul = $('dFiles');
  if(!t.files.length){ ul.innerHTML = '<li class="text-slate-400">첨부가 없음.</li>'; return; }
  ul.innerHTML = t.files.map(f => `<li class="flex items-center justify-between gap-2 bg-slate-50 rounded-xl px-3 py-2">
    <span class="min-w-0 truncate"><span class="text-xs text-slate-400 mr-1">${esc(secTitle(f.sec))}</span>${esc(f.name)} <span class="text-xs text-slate-400">${Math.max(1, Math.round(f.size/1024))}KB</span></span>
    <span data-fwrap="${f.id}">${blobURLs[f.id] ? `<a href="${blobURLs[f.id]}" target="_blank" rel="noopener"${SAFE_VIEW.test(f.type||'')?'':` download="${esc(f.name)}"`} class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-mint-500 text-white">열기</a>` : `<button type="button" data-file="${f.id}" class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-white border border-slate-200">준비</button>`}</span>
  </li>`).join('');
}
$('dFiles').addEventListener('click', async e => {
  const b = e.target.closest('button[data-file]'); if(!b) return;
  b.disabled = true; b.textContent = '받는 중…';
  try{
    const r = await rpc('ws_t_file_get', {p_key: KEY, p_id: b.dataset.file});
    if(!r || !r.ok) throw new Error('x');
    const blob = await (await fetch(r.data)).blob();
    blobURLs[b.dataset.file] = URL.createObjectURL(new Blob([blob], {type: SAFE_VIEW.test(r.type||'') ? r.type : 'application/octet-stream'}));
    const t = DATA.teams.find(x => x.id === openTeam); if(t) renderFiles(t);
  }catch(err){ b.disabled = false; b.textContent = '다시'; }
});

/* 비밀번호 새로 정하기 */
$('dPwBtn').addEventListener('click', async () => {
  const pw = $('dPw').value, msg = $('dPwMsg'), btn = $('dPwBtn');
  if(pw.length < 4 || pw.length > 40){ msg.textContent = '4~40자로 적을 것.'; msg.className = 'text-sm mt-2 text-rose-600'; return; }
  const t = DATA.teams.find(x => x.id === openTeam); if(!t) return;
  if(btn.dataset.confirm !== t.id){ btn.dataset.confirm = t.id; btn.textContent = '한 번 더 누르면 바뀜'; msg.textContent = `${t.class}반 ${t.name} 비밀번호를 “${pw}”(으)로 바꿈.`; msg.className = 'text-sm mt-2 text-amber-700'; return; }
  btn.disabled = true;
  try{
    const r = await rpc('ws_t_reset_pw', {p_key: KEY, p_team: t.id, p_pw: pw});
    if(!r || !r.ok) throw new Error(r && r.error);
    msg.textContent = `바꿨음. 학생들에게 새 비밀번호 “${pw}”를 알려 줄 것.`; msg.className = 'text-sm mt-2 text-mint-700 font-semibold';
    $('dPw').value = '';
  }catch(e){ msg.textContent = '바꾸지 못했음. 다시 시도할 것.'; msg.className = 'text-sm mt-2 text-rose-600'; }
  finally{ btn.disabled = false; btn.textContent = '바꾸기'; delete btn.dataset.confirm; }
});
$('dPw').addEventListener('input', () => { const b = $('dPwBtn'); delete b.dataset.confirm; b.textContent = '바꾸기'; });

/* ---------- CSV ---------- */
$('btnCsv').addEventListener('click', () => {
  if(!DATA) return;
  const w = $('fWeek').value;
  const q = s => { let t = String(s==null?'':s); if(/^[=+\-@\t\r]/.test(t)) t = "'" + t; return `"${t.replace(/"/g,'""')}"`; };   // 엑셀 수식 실행 막기
  const lines = [['반','팀','팀장','인원','진행률(%)','마지막 수정','제출','제출 시각','제출자','이번 주 한 것'].map(q).join(',')];
  teamsShown().forEach(t => { const s = lastSubOfWeek(t, w);
    lines.push([t.class, t.name, leaderOf(t.cells), headcount(t.cells), progress(t.cells), t.last ? fmtTime(t.last) : '', s ? 'O' : 'X', s ? fmtTime(s.at) : '', s ? s.submitter : '', s ? s.note : ''].map(q).join(',')); });
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `워크시트_제출현황_${w}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
});

/* ---------- 열쇠 ---------- */
function banner(text, kind){ const b = $('banner'); b.textContent = text; b.className = 'rounded-2xl p-4 text-sm font-semibold ' + (kind === 'bad' ? 'bg-rose-50 text-rose-700' : 'bg-amber-50 text-amber-800'); }
function hideBanner(){ $('banner').className = 'hidden'; }
function lock(msg){
  KEY = null; DATA = null; clearTimeout(timer); lsDel('ws_tkey'); closeDetail();
  $('app').hidden = true; $('gate').hidden = false; $('gKey').value = '';
  $('gMsg').textContent = msg || ''; $('gMsg').className = 'text-sm ' + (msg ? 'text-rose-600' : 'text-slate-500');
}
$('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const k = $('gKey').value.trim(); if(!k) return;
  $('gMsg').textContent = '확인하는 중…'; $('gMsg').className = 'text-sm text-slate-500';
  KEY = k;
  const ok = await load(false);
  if(ok){ if($('gRemember').checked) lsSet('ws_tkey', k); $('gate').hidden = true; $('app').hidden = false; }
  else if(KEY){ $('gMsg').textContent = '서버에 연결하지 못했음. 인터넷 연결을 확인할 것.'; $('gMsg').className = 'text-sm text-rose-600'; KEY = null; clearTimeout(timer); }
});
$('btnOut').addEventListener('click', () => lock(''));
$('btnRefresh').addEventListener('click', () => load(false));
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && KEY) load(true); });

(async function init(){
  const k = lsGet('ws_tkey');
  if(k){ KEY = k; $('gate').hidden = true; $('app').hidden = false; $('stamp').textContent = '불러오는 중…'; const ok = await load(false); if(!ok && KEY){ /* 연결 문제면 화면 유지 */ } }
})();
</script>
</body>
</html>
