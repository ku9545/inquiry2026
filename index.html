<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="탐구 워크시트">
<title>과학탐구 프로젝트 워크시트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { mint: { 50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',400:'#34d399',500:'#10B981',600:'#059669',700:'#047857' } },
      fontFamily: { sans: ['Pretendard','sans-serif'] }
    }
  }
}
</script>
<style>
  body { background:#F8FAFC; font-family:'Pretendard',sans-serif; }
  textarea { resize: vertical; }
  .fieldbox:focus { outline:none; box-shadow:0 0 0 3px rgba(16,185,129,.18); }
  button:focus-visible, a:focus-visible, select:focus-visible { outline:2px solid #059669; outline-offset:2px; }
  input, textarea, select { font-size:16px; }
  @media print {
    .no-print { display:none !important; }
    #printArea { display:block !important; }
    #app, #login, #modal { display:none !important; }
    body { background:#fff; }
  }
  #printArea { display:none; }
  [hidden] { display:none !important; }
</style>
</head>
<body class="text-slate-800">

<!-- Login -->
<section id="login" class="max-w-md mx-auto px-4 py-10">
  <div class="bg-white rounded-2xl shadow-md p-6 sm:p-8">
    <h1 class="text-xl font-bold tracking-tight">과학탐구 프로젝트 워크시트</h1>
    <p class="text-sm text-slate-500 mt-1.5 leading-relaxed">반과 팀 이름, 팀 비밀번호로 들어가면 팀원끼리 같은 워크시트를 함께 쓰고, 쓰는 대로 자동 저장됨.</p>
    <form id="loginForm" class="mt-6 space-y-4" autocomplete="off">
      <div>
        <label for="lgClass" class="block text-sm font-bold mb-1.5">반</label>
        <select id="lgClass" class="fieldbox w-full px-4 py-2.5 rounded-2xl bg-slate-50 text-base">
          <option value="">반 고르기</option>
          <option value="1">1반</option><option value="2">2반</option><option value="3">3반</option><option value="4">4반</option>
          <option value="5">5반</option><option value="6">6반</option><option value="7">7반</option><option value="8">8반</option>
        </select>
      </div>
      <div>
        <label for="lgName" class="block text-sm font-bold mb-1.5">팀 이름</label>
        <input id="lgName" type="text" maxlength="30" autocomplete="off" autocapitalize="off" class="fieldbox w-full px-4 py-2.5 rounded-2xl bg-slate-50 text-base" placeholder="예) 소리없는아우성">
      </div>
      <div>
        <label for="lgPw" class="block text-sm font-bold mb-1.5">팀 비밀번호</label>
        <input id="lgPw" type="password" maxlength="40" autocomplete="off" class="fieldbox w-full px-4 py-2.5 rounded-2xl bg-slate-50 text-base" placeholder="4자 이상">
      </div>
      <label for="lgRemember" class="flex items-center gap-2 text-sm text-slate-500"><input id="lgRemember" type="checkbox" class="w-5 h-5"> 이 기기에서 계속 들어와 있기 (개인 기기에서만)</label>
      <div class="flex gap-2 pt-1">
        <button id="btnLogin" type="submit" class="flex-1 px-4 py-3 text-base font-semibold rounded-2xl bg-mint-500 text-white shadow-sm hover:bg-mint-600 active:scale-95 transition-all duration-200">들어가기</button>
        <button id="btnCreate" type="button" class="flex-1 px-4 py-3 text-base font-semibold rounded-2xl bg-white text-slate-700 shadow-sm border border-slate-200 active:scale-95 transition-all duration-200">새 팀 만들기</button>
      </div>
      <p id="lgMsg" class="text-sm text-slate-500 leading-relaxed" role="status">처음이면 팀장이 반·팀 이름·비밀번호를 정해 <b>새 팀 만들기</b>를 누름. 팀원은 같은 반·이름·비밀번호로 <b>들어가기</b>를 누름.</p>
    </form>
  </div>
</section>

<!-- App -->
<div id="app" hidden>

  <!-- Header -->
  <header class="sticky top-0 z-20 bg-[#F8FAFC]/90 backdrop-blur border-b border-slate-200/60">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4">
      <div class="flex items-start justify-between gap-3 flex-wrap">
        <div class="min-w-0">
          <h1 class="text-lg sm:text-xl font-bold tracking-tight">과학탐구 프로젝트 워크시트</h1>
          <p id="teamLine" class="text-sm text-slate-500 mt-0.5 truncate">—</p>
          <p id="subLine" class="text-xs mt-1 font-semibold text-slate-400">이번 주 제출 전</p>
        </div>
        <div class="flex items-center gap-2 no-print flex-wrap">
          <span id="saveState" class="text-xs text-slate-400 mr-1" role="status">·</span>
          <button id="btnSubmit" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-mint-500 text-white shadow-sm hover:bg-mint-600 active:scale-95 transition-all duration-200">이번 주 제출</button>
          <button id="btnPrint" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-white text-slate-700 shadow-sm active:scale-95 transition-all duration-200">인쇄·PDF</button>
          <button id="btnLogout" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-white text-slate-500 shadow-sm active:scale-95 transition-all duration-200">나가기</button>
        </div>
      </div>
      <!-- Progress -->
      <div class="mt-3 flex items-center gap-3">
        <div class="flex-1 h-2 bg-slate-200 rounded-full overflow-hidden">
          <div id="progBar" class="h-full bg-mint-500 transition-all duration-500" style="width:0%"></div>
        </div>
        <span id="progText" class="text-xs font-semibold text-mint-600 w-12 text-right">0%</span>
      </div>
      <!-- Tabs -->
      <nav id="tabs" class="mt-3 flex gap-1.5 overflow-x-auto pb-1 no-print"></nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 pb-24">
    <div id="banner" class="hidden mb-4 rounded-2xl p-4 text-sm font-semibold" role="status"></div>
    <div id="panels"></div>
    <div class="flex justify-between mt-6 no-print">
      <button id="btnPrev" type="button" class="px-4 py-2.5 text-sm font-semibold rounded-2xl bg-white shadow-sm active:scale-95 transition-all duration-200">← 이전</button>
      <button id="btnNext" type="button" class="px-4 py-2.5 text-sm font-semibold rounded-2xl bg-slate-800 text-white shadow-sm active:scale-95 transition-all duration-200">다음 →</button>
    </div>
  </main>
</div>

<!-- Modal: 이번 주 제출 -->
<div id="modal" hidden class="fixed inset-0 z-40 bg-slate-900/40 flex items-end sm:items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 max-h-[90vh] overflow-auto" role="dialog" aria-modal="true" aria-labelledby="mdTitle">
    <h2 id="mdTitle" class="text-lg font-bold">이번 주 제출</h2>
    <p id="mdWeek" class="text-sm text-slate-500 mt-1">—</p>
    <p class="text-xs text-slate-400 mt-1 leading-relaxed">지금까지 쓴 워크시트 전체가 이번 주 기록으로 선생님께 제출됨. 같은 주에 다시 제출하면 마지막 제출이 이번 주 기록이 됨.</p>
    <div class="mt-4 space-y-3">
      <div>
        <label for="mdWho" class="block text-sm font-bold mb-1.5">제출자 (학번 이름)</label>
        <input id="mdWho" type="text" maxlength="40" autocomplete="off" class="fieldbox w-full px-4 py-2.5 rounded-2xl bg-slate-50 text-base" placeholder="예) 10305 김물리">
      </div>
      <div>
        <label for="mdNote" class="block text-sm font-bold mb-1.5">이번 주 한 것</label>
        <textarea id="mdNote" rows="4" maxlength="2000" class="fieldbox w-full px-4 py-2.5 rounded-2xl bg-slate-50 text-base" placeholder="이번 주에 팀이 한 일과 다음 주 계획"></textarea>
      </div>
      <p id="mdMsg" class="text-sm" role="status"></p>
      <div class="flex gap-2">
        <button id="mdOk" type="button" class="flex-1 px-4 py-3 text-base font-semibold rounded-2xl bg-mint-500 text-white shadow-sm active:scale-95 transition-all duration-200">제출하기</button>
        <button id="mdCancel" type="button" class="px-4 py-3 text-base font-semibold rounded-2xl bg-white border border-slate-200 text-slate-600 active:scale-95 transition-all duration-200">닫기</button>
      </div>
      <div>
        <p class="text-sm font-bold mt-3 mb-1.5">우리 팀 제출 기록</p>
        <ul id="mdHist" class="text-sm text-slate-600 space-y-1"></ul>
      </div>
    </div>
  </div>
</div>

<!-- Print Area -->
<div id="printArea" class="max-w-4xl mx-auto p-8"></div>

<!-- Script -->
<script>
/* ============================================================
   1. 문항 정의 — 이 부분만 고치면 항목을 바꿀 수 있음
   ============================================================ */
const SECTIONS = [
{ id:'team', num:'0', tab:'팀', title:'팀 정보', desc:'우리 팀이 누구이고, 무엇을 해결하려는지 한 줄로 정리합니다.',
  fields:[
    {k:'name', label:'팀명', type:'text', ph:'예) 소리없는아우성'},
    {k:'leader', label:'팀장', type:'group',
      sub:[{k:'id', label:'학번', type:'text', ph:'예) 10305'},{k:'n', label:'이름', type:'text'}]},
    {k:'members', label:'팀원 (학번 · 이름 · 역할)', type:'list', addLabel:'팀원 추가',
      sub:[{k:'id', label:'학번', type:'text', ph:'예) 10312'},{k:'n', label:'이름', type:'text'},{k:'r', label:'역할', type:'text', ph:'예) 실험 설계 · 자료 조사'}]},
    {k:'problem', label:'어떠한 문제를 해결하고자 하는가?', type:'textarea', rows:3,

{ id:'why', num:'1', tab:'왜?', title:'왜 해야 하지 — 설득하기', desc:'이 문제를 왜 지금 풀어야 하는지, 읽는 사람이 공감하도록 설득합니다.',
  fields:[
    {k:'scene', label:'문제 상황 설명', type:'textarea', rows:4, hint:'언제, 어디서, 누가 곤란해지는지 장면이 그려지게 씁니다.'},
    {k:'exp', label:'① 우리가 직접 겪은 불편', type:'textarea', rows:3, hint:'사용자 입장에서 함께 경험해 본 내용'},
    {k:'itv', label:'② 인터뷰로 알게 된 어려움', type:'list', addLabel:'인터뷰 추가',

  ]},

{ id:'prior', num:'2', tab:'선행탐색', title:'이미 해결된 문제는 아닌가', desc:'다른 사람들은 이 문제에 어떻게 접근했는지 조사합니다. 최소 3가지 이상.',
  fields:[
    {k:'items', label:'조사한 것들', type:'list', addLabel:'조사 결과 추가',

        {k:'kind', label:'종류', type:'select', opts:['기존 제품','연구 논문·보고서','기사·매체','기타']},
        {k:'t', label:'제목 / 이름', type:'text'},
        {k:'u', label:'출처 링크', type:'text'},
        {k:'sum', label:'어떻게 해결하려 했나', type:'textarea', rows:2},

{ id:'define', num:'3', tab:'문제정의', title:'문제 정의하기', desc:'앞선 시도들이 있는데도 문제가 남아 있는 이유를 짚고, 우리 문제를 한 문장으로 못 박습니다.',

    {k:'stmt', label:'우리가 정의한 문제 (한 문장)', type:'textarea', rows:2,
      hint:'“○○한 상황의 △△가, □□ 때문에 ◇◇하지 못한다” 형태로 써 보면 잘 잡힙니다.'},

  ]},

{ id:'idea', num:'4', tab:'아이디어', title:'아이디어 내기', desc:'비난도 평가도 금지. 일단 많이 모으고, 그다음 묶습니다.',

    {k:'why', label:'이것을 고른 근거', type:'textarea', rows:3, hint:'실현 가능성 · 효과 · 우리가 할 수 있는 범위'}

  fields:[

    {k:'ex_h', label:'[실험] 검증할 가설', type:'textarea', rows:2, when:['methods','실험 설계']},

    {k:'ex_m', label:'[실험] 재료 목록', type:'list', addLabel:'재료 추가', when:['methods','실험 설계'],

    {k:'pt_d', label:'[프로토타입] 만들 것의 설계 설명', type:'textarea', rows:4, when:['methods','프로토타입 제작'], hint:'도면·스케치는 아래 첨부에. 핵심 기능이 어디서 어떻게 드러나는지 설명합니다.'},
    {k:'pt_c', label:'[프로토타입] 회로 설계와 기능 (피지컬 컴퓨팅인 경우)', type:'textarea', rows:4, when:['methods','프로토타입 제작'], hint:'어떤 센서가 무엇을 감지해 무엇을 작동시키는지. 이 설명이 있어야 AI에게 코딩을 맡길 수 있습니다.'},
    {k:'pt_r', label:'[프로토타입] 만들어 본 결과', type:'textarea', rows:3, when:['methods','프로토타입 제작']},

    {k:'lit', label:'[문헌] 근거로 삼은 문헌', type:'list', addLabel:'문헌 추가', when:['methods','문헌 연구'],

    {k:'lit_c', label:'[문헌] 종합하면 우리 아이디어는 타당한가', type:'textarea', rows:3, when:['methods','문헌 연구']}

{ id:'user', num:'6', tab:'사용자 피드백', title:'당사자에게 확인받기', desc:'검증한 내용을 실제 당사자(혹은 그 입장을 대신할 수 있는 사람)에게 들고 갑니다.',
  fields:[
    {k:'who', label:'누구에게 물었는가', type:'textarea', rows:2, hint:'몇 명에게, 어떤 관계의 사람인지'},
    {k:'q', label:'질문 / 설문 문항', type:'list', addLabel:'문항 추가',
      sub:[{k:'q', label:'문항', type:'textarea', rows:2}]},
    {k:'a', label:'받은 답변 정리', type:'textarea', rows:5},
    {k:'imp', label:'여기서 찾은 개선점', type:'textarea', rows:4, hint:'개선점이 크면 앞 단계로 돌아가도 됩니다. 그건 실패가 아니라 정상 경로입니다.'}
  ]}

function applyOps(v, ops){   // 서버 ws_cell_ops와 똑같이 동작해야 함
  ops.forEach(op => {
    if(op.op === 'sub'){ v = isObj(v) ? {...v} : {}; v[op.f] = op.v; }

// 다른 팀원이 고친 칸을 화면에 반영. 입력 중인 칸은 건드리지 않고, 구조가 바뀌면 입력이 끝난 뒤 다시 그림
function refreshFromRemote(keys){
  const sec = SECTIONS[cur];
  const touchesCur = keys.some(k => k.split('.')[0] === sec.id);
  updateProgress(); updateTeamLine();
  if(!touchesCur) return;
  const active = document.activeElement;
  const typing = active && active.closest && active.closest('#panels') && active.dataset && active.dataset.path;
  if(!typing){ render(false); return; }
  // 줄 구성이 같으면 값만 바꿈. 지금 누른 칸도, 내가 아직 안 보낸 글이 없으면 팀원 글로 바꿔 줌(커서 위치 유지)
  let structural = false;
  keys.forEach(k => {
    if(k.split('.')[0] !== sec.id) return;
    const f = FT[k]; if(!f) return;
    if(f.type === 'checks'){ structural = true; return; }
    if(f.type === 'list'){
      const want = (getV(k) || []).filter(r => r && r._id).map(r => r._id).join('|');
      const box = document.querySelector(`#panels [data-add="${CSS.escape(k)}"]`);
      const have = box ? [...box.parentElement.querySelectorAll('[data-row]')].map(d => d.dataset.row).join('|') : null;
      if(want !== have){
        structural = true;
        // 내가 쓰던 줄을 팀원이 지웠으면 바로 알리고 다시 그림
        if(active && active.dataset && active.dataset.rid && active.dataset.path === k && !want.split('|').includes(active.dataset.rid)){
          banner('팀원이 지금 쓰던 줄을 지웠음. 필요하면 새 줄을 추가해 다시 적을 것.', 'warn', 'rowdel');
          active.blur(); render(false); structural = false;
        }
        return;
      }
    }
    document.querySelectorAll('#panels [data-path]').forEach(el => {
      if(el.dataset.path !== k && !el.dataset.path.startsWith(k + '.')) return;
      if(el === active && isDirty(k)) return;
      const v = String(elValue(el));
      if(el.value === v) return;
      if(el === active && el.tagName !== 'SELECT'){
        const a = el.selectionStart, b = el.selectionEnd; el.value = v;
        try{ el.setSelectionRange(Math.min(a, v.length), Math.min(b, v.length)); }catch(e){}
      } else el.value = v;
    });
  });
  if(structural) pendingRender = true;
}

    if(pendingRender && !(a && a.closest && a.closest('#panels') && a.dataset && a.dataset.path)) render(false);
  }, 50);

// 목록·묶음·체크 칸: 바뀐 것 한 건(op)을 쌓고, 화면 값에도 바로 반영
function opPush(k, op, delay){
  if(!S || !S.alive || !S.loaded) return;
  const m = getMeta(k);
  if(!m.ops){ m.ops = []; m.base = clone(getV(k)); m.inflight = 0; }
  const last = m.ops[m.ops.length - 1];
  if(last && m.ops.length > m.inflight && (op.op === 'rset' || op.op === 'sub') && last.op === op.op && last.id === op.id && last.f === op.f) last.v = op.v;
  else m.ops.push(op);
  setV(k, applyOps(getV(k), [op]));
  clearTimeout(m.timer); m.timer = setTimeout(() => { m.timer = null; saveNow(k); }, delay == null ? DEBOUNCE : delay);
  saveState(); updateProgress(); updateTeamLine();
}
function saveOps(k, m, T){
  if(!m.ops.length){ saveState(); return; }
  const batch = m.ops.slice(0, 300); m.inflight = batch.length;
  m.saving = true; saveState();
  rpc('ws_cell_ops', {p_token:T.token, p_key:k, p_ops:batch}).then(r => {
    m.saving = false; m.inflight = 0;
    if(T !== S) return;
    if(r && r.ok){
      m.ops.splice(0, batch.length); m.err = ''; m.fails = 0; m.updated = Number(r.updated)||m.updated; T.lastSave = Date.now();
      m.base = r.v;
      const before = JSON.stringify(getV(k)), now = applyOps(clone(r.v), m.ops);
      setV(k, now);
      if(JSON.stringify(now) !== before) refreshFromRemote([k]);   // 그 사이 팀원이 바꾼 것까지 들어옴
      if(m.queued || m.ops.length){ m.queued = false; if(!m.timer) saveNow(k); }
      saveState(); return;
    }
    m.queued = false;
    if(r && r.error === 'bad_token'){ kicked(); return; }
    if(r && r.error === 'too_large'){ m.err = '내용이 너무 김'; banner('이 칸의 내용이 너무 길어 저장하지 못했음. 나눠서 적을 것.', 'bad'); saveState(); return; }
    retry(k, m, T);
  }, () => { m.saving = false; m.inflight = 0; m.queued = false; if(T === S) retry(k, m, T); });
}
function flushAll(){ Object.keys(meta).forEach(k => { const m = meta[k]; if(m.timer){ clearTimeout(m.timer); m.timer = null; saveNow(k); } }); }
function saveNow(k){
  const T = S; if(!T || !T.alive) return;
  const m = getMeta(k);
  if(m.timer){ clearTimeout(m.timer); m.timer = null; }
  if(m.saving){ m.queued = true; return; }
  if(m.ops){ saveOps(k, m, T); return; }
  const seq = m.seq;
  const val = getV(k);
  m.saving = true; saveState();
  rpc('ws_cell_put', {p_token:T.token, p_key:k, p_value: val === undefined ? null : val}).then(r => {
    m.saving = false;
    if(T !== S) return;
    if(r && r.ok){
      m.sent = Math.max(m.sent, seq); m.err = ''; m.fails = 0; m.updated = Number(r.updated)||m.updated; T.lastSave = Date.now();
      if(m.queued || m.seq !== m.sent){ m.queued = false; saveNow(k); return; }
      saveState(); return;
    }
    m.queued = false;
    if(r && r.error === 'bad_token'){ kicked(); return; }
    if(r && r.error === 'too_large'){ m.err = '내용이 너무 김'; banner('이 칸의 내용이 너무 길어 저장하지 못했음. 나눠서 적을 것.', 'bad'); saveState(); return; }
    retry(k, m, T);
  }, () => { m.saving = false; m.queued = false; if(T === S) retry(k, m, T); });
}
function retry(k, m, T){
  m.fails++; m.err = 'net';
  const d = Math.min(30000, 3000 * Math.pow(2, m.fails - 1));
  setTimeout(() => { if(S === T && T.alive && meta[k] === m && isDirty(k) && !m.saving && !m.timer) saveNow(k); }, d);
  saveState();
}
function whenSaved(timeoutMs){
  flushAll();
  return new Promise(res => {
    const t0 = Date.now();
    (function wait(){ if(!anyDirty() || Date.now()-t0 > timeoutMs) return res(!anyDirty()); setTimeout(wait, 200); })();
  });
}

/* ============================================================

   ============================================================ */
function poll(){
  const T = S; if(!T || !T.alive) return;
  clearTimeout(T.timer);
  const gen = T.pollGen = (T.pollGen || 0) + 1;   // 마지막으로 시작한 확인만 다음 확인을 예약함 (겹쳐 도는 것 막기)
  if(document.visibilityState === 'hidden' && T.loaded){ T.timer = setTimeout(poll, POLL_MS); return; }
  const args = {p_token:T.token};
  if(T.since) args.p_since = new Date(T.since).toISOString();
  rpc('ws_pull', args).then(r => {
    if(T !== S || !T.alive || gen !== T.pollGen) return;
    if(!r || !r.ok){ if(r && r.error === 'bad_token'){ kicked(); return; } throw new Error('x'); }
    T.netFail = 0; T.since = Number(r.now) - SINCE_MARGIN;
    if(r.team){ T.team = r.team.name; T.cls = r.team.class; }
    const changed = [];
    (r.cells || []).forEach(c => {
      if(!c || typeof c.k !== 'string' || !/^[a-z_]+\.[a-z_]+$/.test(c.k)) return;
      const m = getMeta(c.k);
      const op = isOpKey(c.k);
      if(op ? m.saving : isDirty(c.k)) return;      // 목록류는 저장 중만 건너뜀(응답이 최신 값을 줌)
      if(m.updated && Number(c.updated) < m.updated) return;
      const [a,b] = c.k.split('.');
      const oldJ = JSON.stringify(state[a] ? state[a][b] : undefined);
      m.updated = Number(c.updated) || m.updated;
      let nv = c.v;
      if(op){ m.base = clone(c.v); if(m.ops && m.ops.length) nv = applyOps(clone(c.v), m.ops); }   // 팀원 것 위에 내 안 보낸 것을 다시 얹음
      if(oldJ === JSON.stringify(nv)) return;
      if(!state[a]) state[a] = {};
      if(nv === null || nv === undefined) delete state[a][b]; else state[a][b] = nv;
      changed.push(c.k);
    });
    const fj = JSON.stringify(r.files || []);
    const filesChanged = fj !== JSON.stringify(files);
    files = r.files || [];
    subs = r.subs || [];
    if(!T.loaded){
      T.loaded = true;
      render(true); updateProgress(); updateTeamLine(); updateSubLine(); saveState();
    } else {
      if(changed.length) refreshFromRemote(changed);
      if(filesChanged) renderFiles();
      updateSubLine();
    }
    hideBanner('net');
    T.timer = setTimeout(poll, POLL_MS);
  }).catch(() => {
    if(T !== S || !T.alive || gen !== T.pollGen) return;
    T.netFail = (T.netFail||0) + 1;
    if(T.netFail >= 2) banner('서버 연결이 불안정함. 쓴 글은 연결되면 저장되니 이 창을 닫지 말 것.', 'warn', 'net');
    T.timer = setTimeout(poll, Math.min(30000, POLL_MS * Math.pow(2, T.netFail - 1)));
  });
}

const IMG = /^image\//;
const fileURLs = {};
// 바로 보여 줘도 안전한 형식만 그대로 열고, 나머지(html·svg 등)는 실행되지 않게 '받기'로만 줌
const SAFE_VIEW = /^(image\/(jpeg|png|gif|webp|heic|heif)|application\/pdf|text\/plain|audio\/|video\/)/i;
async function safeBlobURL(dataURL, type){
  const blob = await (await fetch(dataURL)).blob();
  const t = SAFE_VIEW.test(type||'') ? type : 'application/octet-stream';
  return URL.createObjectURL(new Blob([blob], {type: t}));
}
function renderFiles(){

    <input type="file" id="fileInput" multiple class="hidden">`;
  document.getElementById('fileInput').addEventListener('change', e => addFiles(e.target));
  if(!(S && S.alive && S.loaded)) setEditable(false);

function shrinkImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600/Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let q = 0.82, d = cv.toDataURL('image/jpeg', q);
      while(d.length > 700000 && q > 0.35){ q -= 0.1; d = cv.toDataURL('image/jpeg', q); }
      res({data:d, type:'image/jpeg', name:file.name.replace(/\.[^.]+$/,'') + '.jpg'});
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function readAsDataURL(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
async function addFiles(input){
  const T = S; if(!T || !T.alive || !T.loaded) return;
  const sec = SECTIONS[cur].id;
  const picked = Array.from(input.files || []); input.value = '';
  const msg = t => { const el = document.getElementById('fileMsg'); if(el) el.textContent = t; };
  for(const file of picked){
    try{
      let item;
      if(IMG.test(file.type) && !/svg/.test(file.type)) item = await shrinkImage(file);
      else {
        if(file.size > MAX_FILE){ msg(`${file.name}: 2MB가 넘어 올리지 못했음. 드라이브 링크를 글 칸에 적을 것.`); continue; }
        item = {data: await readAsDataURL(file), type: file.type || 'application/octet-stream', name: file.name};
      }
      msg(`${item.name} 올리는 중…`);
      const r = await rpc('ws_file_add', {p_token:T.token, p_sec:sec, p_name:item.name.slice(0,120), p_type:item.type.slice(0,100), p_data:item.data});
      if(!r || !r.ok){ if(r && r.error === 'bad_token'){ kicked(); return; } msg(`${item.name}: ${errText(r && r.error)}`); continue; }
      files.push({id:r.id, sec, name:item.name, type:item.type, size:r.size});
      msg(`${item.name} 올렸음.`);
      renderFiles(); msg(`${item.name} 올렸음.`);
    }catch(e){ msg(`${file.name}: ${errText(e && e.code)}`); }
  }
}

function filled(v){   // 빈 줄만 추가한 것은 쓴 것으로 치지 않음 (교사용과 같아야 함)
  if(Array.isArray(v)) return v.some(x => (x && typeof x === 'object') ? Object.keys(x).some(k => k !== '_id' && String(x[k]||'').trim() !== '') : String(x||'').trim() !== '');
  if(v && typeof v === 'object') return Object.keys(v).some(k => k !== '_id' && String(v[k]||'').trim() !== '');
  return !!(v && String(v).trim() !== '');
}
function updateProgress(){

}

   ============================================================ */
function doPrint(){
  let h = `<h1 style="font-size:22px;font-weight:800;margin-bottom:4px">${esc(S?S.cls+'반 · '+S.team:'')} — 과학탐구 프로젝트</h1>
           <p style="color:#64748b;font-size:13px;margin-bottom:24px">${new Date().toLocaleDateString('ko-KR')}</p>`;
  SECTIONS.forEach(sec => {
    h += `<h2 style="font-size:16px;font-weight:700;margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid #10B981">${sec.num}. ${esc(sec.title)}</h2>`;
    sec.fields.filter(f=>visible(f,sec)).forEach(f => {
      const v = getV(sec.id+'.'+f.k);
      if(!filled(v)) return;
      h += `<div style="margin:10px 0"><div style="font-size:13px;font-weight:700;color:#334155">${esc(f.label)}</div>`;
      if(Array.isArray(v) && f.type==='checks') h += `<div style="font-size:14px">${v.map(esc).join(' · ')}</div>`;
      else if(Array.isArray(v)) h += `<ol style="font-size:14px;padding-left:18px">${v.filter(rowFilled).map(row=>`<li style="margin:4px 0">${f.sub.map(s=>row&&row[s.k]?`<b>${esc(s.label)}:</b> ${esc(row[s.k])}`:'').filter(Boolean).join(' / ')}</li>`).join('')}</ol>`;
      else if(typeof v === 'object') h += `<div style="font-size:14px">${f.sub.map(s=>v[s.k]?`<b>${esc(s.label)}:</b> ${esc(v[s.k])}`:'').filter(Boolean).join('<br>')}</div>`;
      else h += `<div style="font-size:14px;white-space:pre-wrap;line-height:1.7">${esc(v)}</div>`;
      h += `</div>`;
    });
    const fl = files.filter(f => f.sec === sec.id);
    if(fl.length) h += `<div style="font-size:12px;color:#64748b">📎 첨부: ${fl.map(f=>esc(f.name)).join(', ')}</div>`;
  });
  document.getElementById('printArea').innerHTML = h;
  window.print();
}
document.getElementById('btnPrint').addEventListener('click', doPrint);
document.getElementById('btnLogout').addEventListener('click', () => leave(false));

/* ============================================================
   13. 시작
   ============================================================ */
document.getElementById('loginForm').addEventListener('submit', e => { e.preventDefault(); doLogin(false); });
document.getElementById('btnCreate').addEventListener('click', () => doLogin(true));
window.addEventListener('pagehide', flushAll);
window.addEventListener('beforeunload', e => { flushAll(); if(anyDirty()){ e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') flushAll(); else if(S && S.alive && S.loaded) poll(); });

(function init(){
  const c = lsGet('ws_class'), t = lsGet('ws_team'), tok = lsGet('ws_token');
  if(c) document.getElementById('lgClass').value = c;
  if(t) document.getElementById('lgName').value = t;
  if(tok && /^[0-9a-f-]{36}$/i.test(tok) && t){ document.getElementById('lgRemember').checked = true; enter({token:tok, team:t, cls:Number(c)}, false); }
  else if(tok) lsDel('ws_token');
})();
</script>
