<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="탐구 워크시트">
<title>과학탐구 프로젝트 워크시트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { mint: { 50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',400:'#34d399',500:'#10B981',600:'#059669',700:'#047857' } },
      fontFamily: { sans: ['Pretendard','sans-serif'] }
    }
  }
}
</script>
<style>
  body { background:#F8FAFC; font-family:'Pretendard',sans-serif; }
  textarea { resize: vertical; }
  .fieldbox:focus { outline:none; box-shadow:0 0 0 3px rgba(16,185,129,.18); }
  button:focus-visible, a:focus-visible, select:focus-visible { outline:2px solid #059669; outline-offset:2px; }
  input, textarea, select { font-size:16px; }
  @media print {
    .no-print { display:none !important; }
    #printArea { display:block !important; }
    #app, #login, #modal { display:none !important; }
    body { background:#fff; }
  }
  #printArea { display:none; }
  [hidden] { display:none !important; }
</style>
</head>
<body class="text-slate-800">

<!-- Login -->
<section id="login" class="max-w-md mx-auto px-4 py-10">
  <div class="bg-white rounded-2xl shadow-md p-6 sm:p-8">
    <h1 class="text-xl font-bold tracking-tight">과학탐구 프로젝트 워크시트</h1>
    <p class="text-sm text-slate-500 mt-1.5 leading-relaxed">반과 팀 이름, 팀 비밀번호로 들어가면 팀원끼리 같은 워크시트를 함께 쓰고, 쓰는 대로 자동 저장됨.</p>
    <form id="loginForm" class="mt-6 space-y-4" autocomplete="off">
      <div>
        <label for="lgClass" class="block text-sm font-bold mb-1.5">반</label>
        <select id="lgClass" class="fieldbox w-full px-4 py-2.5 rounded-2xl bg-slate-50 text-base">
          <option value="">반 고르기</option>
          <option value="1">1반</option><option value="2">2반</option><option value="3">3반</option><option value="4">4반</option>
          <option value="5">5반</option><option value="6">6반</option><option value="7">7반</option><option value="8">8반</option>
        </select>
      </div>
      <div>
        <label for="lgName" class="block text-sm font-bold mb-1.5">팀 이름</label>
        <input id="lgName" type="text" maxlength="30" autocomplete="off" autocapitalize="off" class="fieldbox w-full px-4 py-2.5 rounded-2xl bg-slate-50 text-base" placeholder="예) 소리없는아우성">
      </div>
      <div>
        <label for="lgPw" class="block text-sm font-bold mb-1.5">팀 비밀번호</label>
        <input id="lgPw" type="password" maxlength="40" autocomplete="off" class="fieldbox w-full px-4 py-2.5 rounded-2xl bg-slate-50 text-base" placeholder="4자 이상">
      </div>
      <label for="lgRemember" class="flex items-center gap-2 text-sm text-slate-500"><input id="lgRemember" type="checkbox" class="w-5 h-5"> 이 기기에서 계속 들어와 있기 (개인 기기에서만)</label>
      <div class="flex gap-2 pt-1">
        <button id="btnLogin" type="submit" class="flex-1 px-4 py-3 text-base font-semibold rounded-2xl bg-mint-500 text-white shadow-sm hover:bg-mint-600 active:scale-95 transition-all duration-200">들어가기</button>
        <button id="btnCreate" type="button" class="flex-1 px-4 py-3 text-base font-semibold rounded-2xl bg-white text-slate-700 shadow-sm border border-slate-200 active:scale-95 transition-all duration-200">새 팀 만들기</button>
      </div>
      <p id="lgMsg" class="text-sm text-slate-500 leading-relaxed" role="status">처음이면 팀장이 반·팀 이름·비밀번호를 정해 <b>새 팀 만들기</b>를 누름. 팀원은 같은 반·이름·비밀번호로 <b>들어가기</b>를 누름.</p>
    </form>
  </div>
</section>

<!-- App -->
<div id="app" hidden>

  <!-- Header -->
  <header class="sticky top-0 z-20 bg-[#F8FAFC]/90 backdrop-blur border-b border-slate-200/60">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4">
      <div class="flex items-start justify-between gap-3 flex-wrap">
        <div class="min-w-0">
          <h1 class="text-lg sm:text-xl font-bold tracking-tight">과학탐구 프로젝트 워크시트</h1>
          <p id="teamLine" class="text-sm text-slate-500 mt-0.5 truncate">—</p>
          <p id="subLine" class="text-xs mt-1 font-semibold text-slate-400">이번 주 제출 전</p>
        </div>
        <div class="flex items-center gap-2 no-print flex-wrap">
          <span id="saveState" class="text-xs text-slate-400 mr-1" role="status">·</span>
          <button id="btnSubmit" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-mint-500 text-white shadow-sm hover:bg-mint-600 active:scale-95 transition-all duration-200">이번 주 제출</button>
          <button id="btnPrint" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-white text-slate-700 shadow-sm active:scale-95 transition-all duration-200">인쇄·PDF</button>
          <button id="btnLogout" type="button" class="px-3 py-2 text-sm font-semibold rounded-2xl bg-white text-slate-500 shadow-sm active:scale-95 transition-all duration-200">나가기</button>
        </div>
      </div>
      <!-- Progress -->
      <div class="mt-3 flex items-center gap-3">
        <div class="flex-1 h-2 bg-slate-200 rounded-full overflow-hidden">
          <div id="progBar" class="h-full bg-mint-500 transition-all duration-500" style="width:0%"></div>
        </div>
        <span id="progText" class="text-xs font-semibold text-mint-600 w-12 text-right">0%</span>
      </div>
      <!-- Tabs -->
      <nav id="tabs" class="mt-3 flex gap-1.5 overflow-x-auto pb-1 no-print"></nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 pb-24">
    <div id="banner" class="hidden mb-4 rounded-2xl p-4 text-sm font-semibold" role="status"></div>
    <div id="panels"></div>
    <div class="flex justify-between mt-6 no-print">
      <button id="btnPrev" type="button" class="px-4 py-2.5 text-sm font-semibold rounded-2xl bg-white shadow-sm active:scale-95 transition-all duration-200">← 이전</button>
      <button id="btnNext" type="button" class="px-4 py-2.5 text-sm font-semibold rounded-2xl bg-slate-800 text-white shadow-sm active:scale-95 transition-all duration-200">다음 →</button>
    </div>
  </main>
</div>

<!-- Modal: 이번 주 제출 -->
<div id="modal" hidden class="fixed inset-0 z-40 bg-slate-900/40 flex items-end sm:items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 max-h-[90vh] overflow-auto" role="dialog" aria-modal="true" aria-labelledby="mdTitle">
    <h2 id="mdTitle" class="text-lg font-bold">이번 주 제출</h2>
    <p id="mdWeek" class="text-sm text-slate-500 mt-1">—</p>
    <p class="text-xs text-slate-400 mt-1 leading-relaxed">지금까지 쓴 워크시트 전체가 이번 주 기록으로 선생님께 제출됨. 같은 주에 다시 제출하면 마지막 제출이 이번 주 기록이 됨.</p>
    <div class="mt-4 space-y-3">
      <div>
        <label for="mdWho" class="block text-sm font-bold mb-1.5">제출자 (학번 이름)</label>
        <input id="mdWho" type="text" maxlength="40" autocomplete="off" class="fieldbox w-full px-4 py-2.5 rounded-2xl bg-slate-50 text-base" placeholder="예) 10305 김물리">
      </div>
      <div>
        <label for="mdNote" class="block text-sm font-bold mb-1.5">이번 주 한 것</label>
        <textarea id="mdNote" rows="4" maxlength="2000" class="fieldbox w-full px-4 py-2.5 rounded-2xl bg-slate-50 text-base" placeholder="이번 주에 팀이 한 일과 다음 주 계획"></textarea>
      </div>
      <p id="mdMsg" class="text-sm" role="status"></p>
      <div class="flex gap-2">
        <button id="mdOk" type="button" class="flex-1 px-4 py-3 text-base font-semibold rounded-2xl bg-mint-500 text-white shadow-sm active:scale-95 transition-all duration-200">제출하기</button>
        <button id="mdCancel" type="button" class="px-4 py-3 text-base font-semibold rounded-2xl bg-white border border-slate-200 text-slate-600 active:scale-95 transition-all duration-200">닫기</button>
      </div>
      <div>
        <p class="text-sm font-bold mt-3 mb-1.5">우리 팀 제출 기록</p>
        <ul id="mdHist" class="text-sm text-slate-600 space-y-1"></ul>
      </div>
    </div>
  </div>
</div>

<!-- Print Area -->
<div id="printArea" class="max-w-4xl mx-auto p-8"></div>

<!-- Script -->
<script>
/* ============================================================
   1. 문항 정의 — 이 부분만 고치면 항목을 바꿀 수 있음
   ============================================================ */
const SECTIONS = [
{ id:'team', num:'0', tab:'팀', title:'팀 정보', desc:'우리 팀이 누구이고, 무엇을 해결하려는지 한 줄로 정리합니다.',
  fields:[
    {k:'name', label:'팀명', type:'text', ph:'예) 소리없는아우성'},
    {k:'leader', label:'팀장', type:'group',
      sub:[{k:'id', label:'학번', type:'text', ph:'예) 10305'},{k:'n', label:'이름', type:'text'}]},
    {k:'members', label:'팀원 (학번 · 이름 · 역할)', type:'list', addLabel:'팀원 추가',
      sub:[{k:'id', label:'학번', type:'text', ph:'예) 10312'},{k:'n', label:'이름', type:'text'},{k:'r', label:'역할', type:'text', ph:'예) 실험 설계 · 자료 조사'}]},
    {k:'problem', label:'어떠한 문제를 해결하고자 하는가?', type:'textarea', rows:3,
      hint:'한두 문장으로. 뒤에서 더 다듬게 되니 지금은 거칠어도 괜찮습니다.'}
  ]},

{ id:'why', num:'1', tab:'왜?', title:'왜 해야 하지 — 설득하기', desc:'이 문제를 왜 지금 풀어야 하는지, 읽는 사람이 공감하도록 설득합니다.',
  fields:[
    {k:'scene', label:'문제 상황 설명', type:'textarea', rows:4, hint:'언제, 어디서, 누가 곤란해지는지 장면이 그려지게 씁니다.'},
    {k:'exp', label:'① 우리가 직접 겪은 불편', type:'textarea', rows:3, hint:'사용자 입장에서 함께 경험해 본 내용'},
    {k:'itv', label:'② 인터뷰로 알게 된 어려움', type:'list', addLabel:'인터뷰 추가',
      sub:[{k:'who', label:'대상(누구에게)', type:'text'},{k:'what', label:'들은 이야기', type:'textarea', rows:2}]},
    {k:'ref', label:'③ 심각성을 보여주는 자료', type:'list', addLabel:'자료 추가',
      sub:[{k:'t', label:'제목', type:'text', ph:'뉴스 기사 · 통계'},{k:'u', label:'출처 링크', type:'text'},{k:'s', label:'무엇을 보여주는 자료인가', type:'textarea', rows:2}]}
  ]},

{ id:'prior', num:'2', tab:'선행탐색', title:'이미 해결된 문제는 아닌가', desc:'다른 사람들은 이 문제에 어떻게 접근했는지 조사합니다. 최소 3가지 이상.',
  fields:[
    {k:'items', label:'조사한 것들', type:'list', addLabel:'조사 결과 추가',
      sub:[
        {k:'kind', label:'종류', type:'select', opts:['기존 제품','연구 논문·보고서','기사·매체','기타']},
        {k:'t', label:'제목 / 이름', type:'text'},
        {k:'u', label:'출처 링크', type:'text'},
        {k:'sum', label:'어떻게 해결하려 했나', type:'textarea', rows:2},
        {k:'lim', label:'그럼에도 남는 한계', type:'textarea', rows:2}
      ]}
  ]},

{ id:'define', num:'3', tab:'문제정의', title:'문제 정의하기', desc:'앞선 시도들이 있는데도 문제가 남아 있는 이유를 짚고, 우리 문제를 한 문장으로 못 박습니다.',
  fields:[
    {k:'fails', label:'기존 시도가 충분하지 않은 이유', type:'list', addLabel:'이유 추가',
      sub:[{k:'r', label:'이유', type:'textarea', rows:2, ph:'예) 가격이 비싸 학교에서 쓸 수 없다'}]},
    {k:'stmt', label:'우리가 정의한 문제 (한 문장)', type:'textarea', rows:2,
      hint:'“○○한 상황의 △△가, □□ 때문에 ◇◇하지 못한다” 형태로 써 보면 잘 잡힙니다.'},
    {k:'seed', label:'그래서 떠오른 우리 아이디어의 방향', type:'textarea', rows:3}
  ]},

{ id:'idea', num:'4', tab:'아이디어', title:'아이디어 내기', desc:'비난도 평가도 금지. 일단 많이 모으고, 그다음 묶습니다.',
  fields:[
    {k:'pool', label:'발산 — 나온 아이디어 전부', type:'list', addLabel:'아이디어 추가',
      hint:'돌아가면서 이야기하고, 나온 것은 아무리 엉뚱해도 일단 적습니다.',
      sub:[{k:'by', label:'낸 사람', type:'text'},{k:'i', label:'아이디어', type:'textarea', rows:2}]},
    {k:'group', label:'수렴 — 비슷한 것끼리 묶기', type:'list', addLabel:'묶음 추가',
      sub:[{k:'g', label:'묶음 이름', type:'text'},{k:'d', label:'묶인 아이디어와 보완한 점', type:'textarea', rows:2}]},
    {k:'final', label:'최종 선정 아이디어', type:'textarea', rows:3},
    {k:'why', label:'이것을 고른 근거', type:'textarea', rows:3, hint:'실현 가능성 · 효과 · 우리가 할 수 있는 범위'}
  ]},

{ id:'verify', num:'5', tab:'검증', title:'아이디어 검증하기', desc:'쓸 방법을 고르면 해당 칸만 열립니다. 여러 개 골라도 됩니다.',
  fields:[
    {k:'methods', label:'검증 방법 선택', type:'checks', opts:['실험 설계','프로토타입 제작','AI 시뮬레이션','문헌 연구']},

    {k:'ex_h', label:'[실험] 검증할 가설', type:'textarea', rows:2, when:['methods','실험 설계']},
    {k:'ex_v', label:'[실험] 변인 설정', type:'group', when:['methods','실험 설계'],
      sub:[{k:'iv', label:'독립 변인 (내가 바꾸는 것)', type:'text'},{k:'dv', label:'종속 변인 (측정하는 것)', type:'text'},{k:'cv', label:'통제 변인 (일정하게 두는 것)', type:'textarea', rows:2}]},
    {k:'ex_m', label:'[실험] 재료 목록', type:'list', addLabel:'재료 추가', when:['methods','실험 설계'],
      hint:'파는 곳과 가격까지 적어야 실제로 실행할 수 있습니다.',
      sub:[{k:'n', label:'재료명', type:'text'},{k:'q', label:'수량', type:'text'},{k:'s', label:'파는 곳', type:'text'},{k:'p', label:'가격', type:'text'}]},
    {k:'ex_p', label:'[실험] 실험 절차', type:'textarea', rows:5, when:['methods','실험 설계'], hint:'다른 사람이 그대로 따라 할 수 있을 만큼 순서대로.'},
    {k:'ex_r', label:'[실험] 결과와 데이터 분석', type:'textarea', rows:5, when:['methods','실험 설계'], hint:'표·그래프는 아래 첨부에 올리고, 여기엔 무엇이 보였는지 씁니다.'},

    {k:'pt_m', label:'[프로토타입] 사용할 재료', type:'textarea', rows:2, when:['methods','프로토타입 제작'], ph:'골판지, 아크릴, 3D 프린팅, 아두이노 등'},
    {k:'pt_d', label:'[프로토타입] 만들 것의 설계 설명', type:'textarea', rows:4, when:['methods','프로토타입 제작'], hint:'도면·스케치는 아래 첨부에. 핵심 기능이 어디서 어떻게 드러나는지 설명합니다.'},
    {k:'pt_c', label:'[프로토타입] 회로 설계와 기능 (피지컬 컴퓨팅인 경우)', type:'textarea', rows:4, when:['methods','프로토타입 제작'], hint:'어떤 센서가 무엇을 감지해 무엇을 작동시키는지. 이 설명이 있어야 AI에게 코딩을 맡길 수 있습니다.'},
    {k:'pt_r', label:'[프로토타입] 만들어 본 결과', type:'textarea', rows:3, when:['methods','프로토타입 제작']},

    {k:'sim_t', label:'[시뮬레이션] 사용한 도구', type:'text', when:['methods','AI 시뮬레이션'], ph:'예) Claude, PhET, 파이썬 코드'},
    {k:'sim_c', label:'[시뮬레이션] 설정한 조건', type:'textarea', rows:3, when:['methods','AI 시뮬레이션']},
    {k:'sim_r', label:'[시뮬레이션] 결과와 해석', type:'textarea', rows:4, when:['methods','AI 시뮬레이션'], hint:'시뮬레이션 결과를 그대로 믿지 말고, 현실과 다를 수 있는 지점도 함께 적습니다.'},
    {k:'sim_go', label:'[시뮬레이션] 만든 시뮬레이션 올리고 바로 보기', type:'simlink', when:['methods','AI 시뮬레이션'], noProgress:true},

    {k:'lit', label:'[문헌] 근거로 삼은 문헌', type:'list', addLabel:'문헌 추가', when:['methods','문헌 연구'],
      sub:[{k:'t', label:'제목·저자', type:'text'},{k:'u', label:'출처', type:'text'},{k:'link', label:'우리 주장과 어떻게 연결되는가', type:'textarea', rows:2}]},
    {k:'lit_c', label:'[문헌] 종합하면 우리 아이디어는 타당한가', type:'textarea', rows:3, when:['methods','문헌 연구']}
  ]},

{ id:'sim', num:'5+', tab:'시뮬레이션', title:'시뮬레이션 올리고 바로 보기', desc:'파이썬 코드나 HTML 코드·파일을 올리면 아이패드에서도 여기서 바로 실행해 볼 수 있습니다. 팀원과 선생님도 같은 시뮬레이션을 열어 봅니다. 5. 검증의 AI 시뮬레이션과 이어집니다.',

function refreshFromRemote(keys){
  const sec = SECTIONS[cur];
  const touchesCur = keys.some(k => k.split('.')[0] === sec.id) || (sec.id === 'verify' && keys.includes('sim.items'));
  updateProgress(); updateTeamLine();
  if(!touchesCur) return;
  const active = document.activeElement;
  const typing = active && active.closest && active.closest('#panels') && active.dataset && active.dataset.path;
  if(!typing){ render(false); return; }
  // 줄 구성이 같으면 값만 바꿈. 지금 누른 칸도, 내가 아직 안 보낸 글이 없으면 팀원 글로 바꿔 줌(커서 위치 유지)
  let structural = false;
  if(sec.id === 'verify' && keys.includes('sim.items')) structural = true;   // 검증 탭의 '올린 개수' 안내
  keys.forEach(k => {
    if(k.split('.')[0] !== sec.id) return;
    const f = FT[k]; if(!f) return;
    if(f.type === 'checks'){ structural = true; return; }
    if(f.type === 'sims'){
      const rows = (getV(k) || []).filter(r => r && r._id);
      const want = rows.map(r => r._id + ':' + (r.fid||'')).join('|');
      const have = [...document.querySelectorAll('#panels [data-simrow]')].map(d => d.dataset.sig).join('|');
      if(want !== have){
        structural = true;
        if(active && active.dataset && active.dataset.rid && active.dataset.path === k && !rows.some(r => r._id === active.dataset.rid)){
          banner('팀원이 지금 쓰던 시뮬레이션을 지웠음.', 'warn', 'rowdel'); active.blur(); render(false); structural = false;
        }
        return;
      }
    }
    if(f.type === 'list'){
      const want = (getV(k) || []).filter(r => r && r._id).map(r => r._id).join('|');
      const box = document.querySelector(`#panels [data-add="${CSS.escape(k)}"]`);
      const have = box ? [...box.parentElement.querySelectorAll('[data-row]')].map(d => d.dataset.row).join('|') : null;
      if(want !== have){
        structural = true;
        // 내가 쓰던 줄을 팀원이 지웠으면 바로 알리고 다시 그림
        if(active && active.dataset && active.dataset.rid && active.dataset.path === k && !want.split('|').includes(active.dataset.rid)){
          banner('팀원이 지금 쓰던 줄을 지웠음. 필요하면 새 줄을 추가해 다시 적을 것.', 'warn', 'rowdel');
          active.blur(); render(false); structural = false;
        }
        return;
      }
    }
    document.querySelectorAll('#panels [data-path]').forEach(el => {
      if(el.dataset.path !== k && !el.dataset.path.startsWith(k + '.')) return;
      if(el === active && isDirty(k)) return;
      const v = String(elValue(el));
      if(el.value === v) return;
      if(el === active && el.tagName !== 'SELECT'){
        const a = el.selectionStart, b = el.selectionEnd; el.value = v;
        try{ el.setSelectionRange(Math.min(a, v.length), Math.min(b, v.length)); }catch(e){}
      } else el.value = v;
    });
  });
  if(structural) pendingRender = true;
}

    const a = document.activeElement;
    if(pendingRender && !(a && a.closest && a.closest('#panels') && a.dataset && a.dataset.path)) render(false);
  }, 50);

  if(!S.alive) { el.textContent = '저장 멈춤'; el.className = 'text-xs text-rose-500 mr-1'; return; }
  const ks = Object.keys(meta);
  if(ks.some(k => meta[k].err && isDirty(k))) { el.textContent = '저장 안 됨 · 다시 시도 중'; el.className = 'text-xs text-rose-500 mr-1'; return; }
  if(ks.some(isDirty)) { el.textContent = '저장 중…'; el.className = 'text-xs text-slate-400 mr-1'; return; }
  el.className = 'text-xs text-mint-600 mr-1';
  el.textContent = S.lastSave ? '저장됨 ' + new Date(S.lastSave).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) : '';
}
function touch(k){
  if(!S || !S.alive || !S.loaded) return;
  const m = getMeta(k); m.seq++;
  clearTimeout(m.timer); m.timer = setTimeout(() => { m.timer = null; saveNow(k); }, DEBOUNCE);
  saveState(); updateProgress(); updateTeamLine();
}
// 목록·묶음·체크 칸: 바뀐 것 한 건(op)을 쌓고, 화면 값에도 바로 반영
function opPush(k, op, delay){
  if(!S || !S.alive || !S.loaded) return;
  const m = getMeta(k);
  if(!m.ops){ m.ops = []; m.base = clone(getV(k)); m.inflight = 0; }
  const last = m.ops[m.ops.length - 1];
  if(last && m.ops.length > m.inflight && (op.op === 'rset' || op.op === 'sub') && last.op === op.op && last.id === op.id && last.f === op.f) last.v = op.v;
  else m.ops.push(op);
  setV(k, applyOps(getV(k), [op]));
  clearTimeout(m.timer); m.timer = setTimeout(() => { m.timer = null; saveNow(k); }, delay == null ? DEBOUNCE : delay);
  saveState(); updateProgress(); updateTeamLine();
}
function saveOps(k, m, T){
  if(!m.ops.length){ saveState(); return; }
  const batch = m.ops.slice(0, 300); m.inflight = batch.length;
  m.saving = true; saveState();
  rpc('ws_cell_ops', {p_token:T.token, p_key:k, p_ops:batch}).then(r => {
    m.saving = false; m.inflight = 0;
    if(T !== S) return;
    if(r && r.ok){
      m.ops.splice(0, batch.length); m.err = ''; m.fails = 0; m.updated = Number(r.updated)||m.updated; T.lastSave = Date.now();
      m.base = r.v;
      const before = JSON.stringify(getV(k)), now = applyOps(clone(r.v), m.ops);
      setV(k, now);
      if(JSON.stringify(now) !== before) refreshFromRemote([k]);   // 그 사이 팀원이 바꾼 것까지 들어옴
      if(m.queued || m.ops.length){ m.queued = false; if(!m.timer) saveNow(k); }
      saveState(); return;
    }
    m.queued = false;
    if(r && r.error === 'bad_token'){ kicked(); return; }
    if(r && r.error === 'too_large'){ m.err = '내용이 너무 김'; banner('이 칸의 내용이 너무 길어 저장하지 못했음. 나눠서 적을 것.', 'bad'); saveState(); return; }
    retry(k, m, T);
  }, () => { m.saving = false; m.inflight = 0; m.queued = false; if(T === S) retry(k, m, T); });
}
function flushAll(){ Object.keys(meta).forEach(k => { const m = meta[k]; if(m.timer){ clearTimeout(m.timer); m.timer = null; saveNow(k); } }); }
function saveNow(k){
  const T = S; if(!T || !T.alive) return;
  const m = getMeta(k);
  if(m.timer){ clearTimeout(m.timer); m.timer = null; }
  if(m.saving){ m.queued = true; return; }
  if(m.ops){ saveOps(k, m, T); return; }
  const seq = m.seq;
  const val = getV(k);
  m.saving = true; saveState();
  rpc('ws_cell_put', {p_token:T.token, p_key:k, p_value: val === undefined ? null : val}).then(r => {
    m.saving = false;
    if(T !== S) return;
    if(r && r.ok){
      m.sent = Math.max(m.sent, seq); m.err = ''; m.fails = 0; m.updated = Number(r.updated)||m.updated; T.lastSave = Date.now();
      if(m.queued || m.seq !== m.sent){ m.queued = false; saveNow(k); return; }
      saveState(); return;
    }
    m.queued = false;
    if(r && r.error === 'bad_token'){ kicked(); return; }
    if(r && r.error === 'too_large'){ m.err = '내용이 너무 김'; banner('이 칸의 내용이 너무 길어 저장하지 못했음. 나눠서 적을 것.', 'bad'); saveState(); return; }
    retry(k, m, T);
  }, () => { m.saving = false; m.queued = false; if(T === S) retry(k, m, T); });
}
function retry(k, m, T){
  m.fails++; m.err = 'net';
  const d = Math.min(30000, 3000 * Math.pow(2, m.fails - 1));
  setTimeout(() => { if(S === T && T.alive && meta[k] === m && isDirty(k) && !m.saving && !m.timer) saveNow(k); }, d);
  saveState();
}
function whenSaved(timeoutMs){
  flushAll();
  return new Promise(res => {
    const t0 = Date.now();
    (function wait(){ if(!anyDirty() || Date.now()-t0 > timeoutMs) return res(!anyDirty()); setTimeout(wait, 200); })();
  });
}

/* ============================================================
   6. 동기화 (팀원 내용 받아 오기)
   ============================================================ */
function poll(){
  const T = S; if(!T || !T.alive) return;
  clearTimeout(T.timer);
  const gen = T.pollGen = (T.pollGen || 0) + 1;   // 마지막으로 시작한 확인만 다음 확인을 예약함 (겹쳐 도는 것 막기)
  if(document.visibilityState === 'hidden' && T.loaded){ T.timer = setTimeout(poll, POLL_MS); return; }
  const args = {p_token:T.token};
  if(T.since) args.p_since = new Date(T.since).toISOString();
  rpc('ws_pull', args).then(r => {
    if(T !== S || !T.alive || gen !== T.pollGen) return;
    if(!r || !r.ok){ if(r && r.error === 'bad_token'){ kicked(); return; } throw new Error('x'); }
    T.netFail = 0; T.since = Number(r.now) - SINCE_MARGIN;
    if(r.team){ T.team = r.team.name; T.cls = r.team.class; }
    const changed = [];
    (r.cells || []).forEach(c => {
      if(!c || typeof c.k !== 'string' || !/^[a-z_]+\.[a-z_]+$/.test(c.k)) return;
      const m = getMeta(c.k);
      const op = isOpKey(c.k);
      if(op ? m.saving : isDirty(c.k)) return;      // 목록류는 저장 중만 건너뜀(응답이 최신 값을 줌)
      if(m.updated && Number(c.updated) < m.updated) return;
      const [a,b] = c.k.split('.');
      const oldJ = JSON.stringify(state[a] ? state[a][b] : undefined);
      m.updated = Number(c.updated) || m.updated;
      let nv = c.v;
      if(op){ m.base = clone(c.v); if(m.ops && m.ops.length) nv = applyOps(clone(c.v), m.ops); }   // 팀원 것 위에 내 안 보낸 것을 다시 얹음
      if(oldJ === JSON.stringify(nv)) return;
      if(!state[a]) state[a] = {};
      if(nv === null || nv === undefined) delete state[a][b]; else state[a][b] = nv;
      changed.push(c.k);
    });
    const fj = JSON.stringify(r.files || []);
    const filesChanged = fj !== JSON.stringify(files);
    files = r.files || [];
    subs = r.subs || [];
    if(!T.loaded){
      T.loaded = true;
      render(true); updateProgress(); updateTeamLine(); updateSubLine(); saveState();
    } else {
      if(changed.length) refreshFromRemote(changed);
      if(filesChanged) renderFiles();
      updateSubLine();
    }
    hideBanner('net');
    T.timer = setTimeout(poll, POLL_MS);
  }).catch(() => {
    if(T !== S || !T.alive || gen !== T.pollGen) return;
    T.netFail = (T.netFail||0) + 1;
    if(T.netFail >= 2) banner('서버 연결이 불안정함. 쓴 글은 연결되면 저장되니 이 창을 닫지 말 것.', 'warn', 'net');
    T.timer = setTimeout(poll, Math.min(30000, POLL_MS * Math.pow(2, T.netFail - 1)));
  });
}

function lgMsg(t, bad){ const el = document.getElementById('lgMsg'); el.textContent = t; el.className = 'text-sm leading-relaxed ' + (bad ? 'text-rose-600' : 'text-slate-500'); }

async function doLogin(create){

  }catch(e){

}
function enter(s, created){
  S = {token:s.token, team:s.team, cls:s.cls, alive:true, loaded:false, since:null, timer:null, netFail:0, lastSave:0};
  state = {}; files = []; subs = []; Object.keys(meta).forEach(k => delete meta[k]); cur = 0;

  render(true); updateTeamLine();
  document.getElementById('saveState').textContent = '불러오는 중…';

}
function leave(force){
  if(!S) return;
  if(S.alive) flushAll();
  if(!force && anyDirty()){
    const stuck = !S.alive || Object.keys(meta).some(k => meta[k].err && isDirty(k));
    if(!stuck){ banner('아직 저장 중인 글이 있음. 잠시 뒤에 다시 눌러 주세요.', 'warn'); return; }
    if(!confirm('저장되지 않은 글이 있음. 그래도 나갈까요?')) return;
  }
  const tok = S.token; S.alive = false; clearTimeout(S.timer);
  rpc('ws_session_end', {p_token:tok}).catch(()=>{});

  document.getElementById('app').hidden = true;
  document.getElementById('login').hidden = false;
  lgMsg('나왔음. 다시 들어가려면 반, 팀 이름, 비밀번호를 적을 것.');

function kicked(){
  if(!S) return;
  if(!S.loaded){ S.alive = false; lsDel('ws_token'); S = null; document.getElementById('app').hidden = true; document.getElementById('login').hidden = false; lgMsg(ERR.bad_token, true); return; }
  S.alive = false; clearTimeout(S.timer);
  banner('팀 확인이 끊겨 저장을 멈췄음. 나가기를 누른 뒤 다시 들어갈 것.', 'bad');

}

/* ============================================================
   8. 첨부 파일 (서버 저장)
   ============================================================ */
const IMG = /^image\//;
const fileURLs = {};
// 바로 보여 줘도 안전한 형식만 그대로 열고, 나머지(html·svg 등)는 실행되지 않게 '받기'로만 줌
const SAFE_VIEW = /^(image\/(jpeg|png|gif|webp|heic|heif)|application\/pdf|text\/plain|audio\/|video\/)/i;
async function safeBlobURL(dataURL, type){
  const blob = await (await fetch(dataURL)).blob();
  const t = SAFE_VIEW.test(type||'') ? type : 'application/octet-stream';
  return URL.createObjectURL(new Blob([blob], {type: t}));
}
function renderFiles(){
  const zone = document.getElementById('fileZone'); if(!zone) return;
  const sec = SECTIONS[cur];
  const list = files.filter(f => f.sec === sec.id);
  const used = files.reduce((a,f)=>a+(Number(f.size)||0),0);
  const items = list.length === 0
    ? `<p class="text-sm text-slate-400 text-center py-6">📎 이 단계의 사진·문서·PDF를 여기에 올리세요.</p>`
    : `<div class="grid sm:grid-cols-2 gap-3">${list.map(f=>`
        <div class="min-w-0 bg-slate-50 rounded-2xl p-4 flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl bg-white shadow-sm flex items-center justify-center shrink-0 overflow-hidden"><span class="text-lg">${IMG.test(f.type)?'🖼':'📄'}</span></div>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-semibold truncate">${esc(f.name)}</p>
            <p class="text-xs text-slate-400">${Math.max(1,Math.round((Number(f.size)||0)/1024))} KB</p>
          </div>
          <span data-open-slot="${esc(f.id)}">${fileURLs[f.id]
            ? `<a href="${fileURLs[f.id]}" target="_blank" rel="noopener"${SAFE_VIEW.test(f.type)?'':` download="${esc(f.name)}"`} class="text-xs font-semibold text-mint-600 px-2 py-1 rounded-lg">열기</a>`
            : `<button type="button" data-fprep="${esc(f.id)}" class="text-xs font-semibold text-mint-600 px-2 py-1 rounded-lg active:scale-95">준비</button>`}</span>
          <button type="button" data-fdel="${esc(f.id)}" aria-label="${esc(f.name)} 지우기" class="text-slate-300 hover:text-rose-500 text-sm px-1">✕</button>
        </div>`).join('')}</div>`;
  zone.innerHTML = `
    <label class="block text-sm font-bold mb-1">첨부 자료</label>
    <p class="text-xs text-slate-400 mb-3 leading-relaxed">사진은 자동으로 줄여서 올림. 문서·PDF·PPT는 한 개 2MB까지, 팀 전체 8MB까지임 (지금 ${(used/1048576).toFixed(1)}MB). 영상이나 큰 파일은 구글 드라이브·유튜브 링크를 글 칸에 적을 것.</p>
    ${items}
    <p id="fileMsg" class="text-sm mt-2" role="status"></p>
    <label for="fileInput" class="mt-3 block w-full py-3 rounded-2xl bg-mint-50 text-mint-700 text-sm font-semibold text-center cursor-pointer active:scale-95 transition-all duration-200">+ 파일 올리기</label>
    <input type="file" id="fileInput" multiple class="hidden">`;
  document.getElementById('fileInput').addEventListener('change', e => addFiles(e.target));
  if(!(S && S.alive && S.loaded)) setEditable(false);
}
function shrinkImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600/Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let q = 0.82, d = cv.toDataURL('image/jpeg', q);
      while(d.length > 700000 && q > 0.35){ q -= 0.1; d = cv.toDataURL('image/jpeg', q); }
      res({data:d, type:'image/jpeg', name:file.name.replace(/\.[^.]+$/,'') + '.jpg'});
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function readAsDataURL(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
async function addFiles(input){
  const T = S; if(!T || !T.alive || !T.loaded) return;
  const sec = SECTIONS[cur].id;
  const picked = Array.from(input.files || []); input.value = '';
  const msg = t => { const el = document.getElementById('fileMsg'); if(el) el.textContent = t; };
  for(const file of picked){
    try{
      let item;
      if(IMG.test(file.type) && !/svg/.test(file.type)) item = await shrinkImage(file);
      else {
        if(file.size > MAX_FILE){ msg(`${file.name}: 2MB가 넘어 올리지 못했음. 드라이브 링크를 글 칸에 적을 것.`); continue; }
        item = {data: await readAsDataURL(file), type: file.type || 'application/octet-stream', name: file.name};
      }
      msg(`${item.name} 올리는 중…`);
      const r = await rpc('ws_file_add', {p_token:T.token, p_sec:sec, p_name:item.name.slice(0,120), p_type:item.type.slice(0,100), p_data:item.data});
      if(!r || !r.ok){ if(r && r.error === 'bad_token'){ kicked(); return; } msg(`${item.name}: ${errText(r && r.error)}`); continue; }
      files.push({id:r.id, sec, name:item.name, type:item.type, size:r.size});
      msg(`${item.name} 올렸음.`);
      renderFiles(); msg(`${item.name} 올렸음.`);
    }catch(e){ msg(`${file.name}: ${errText(e && e.code)}`); }
  }
}
document.addEventListener('click', async e => {

});

const editable = () => S && S.alive && S.loaded;

function filled(v){   // 빈 줄만 추가한 것은 쓴 것으로 치지 않음 (교사용과 같아야 함)
  if(Array.isArray(v)) return v.some(x => (x && typeof x === 'object') ? Object.keys(x).some(k => k !== '_id' && String(x[k]||'').trim() !== '') : String(x||'').trim() !== '');
  if(v && typeof v === 'object') return Object.keys(v).some(k => k !== '_id' && String(v[k]||'').trim() !== '');
  return !!(v && String(v).trim() !== '');
}
// 진행률에 넣을 칸인지 (교사용과 같아야 함): 안내 칸은 빼고, 시뮬레이션 탭은 검증에서 AI 시뮬레이션을 골랐을 때만 셈
function counts(f, sec, get){
  if(f.noProgress) return false;
  if(f.when){ const v = get(sec.id + '.' + f.when[0]); if(!(Array.isArray(v) && v.includes(f.when[1]))) return false; }
  if(f.countWhen){ const v = get(f.countWhen[0]); if(!(Array.isArray(v) && v.includes(f.countWhen[1]))) return false; }
  return true;
}
function updateProgress(){
  let total = 0, done = 0;
  SECTIONS.forEach(sec => sec.fields.forEach(f => {
    if(!counts(f, sec, k => getV(k))) return;
    total++; if(filled(getV(sec.id+'.'+f.k))) done++;
  }));
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progBar').style.width = pct + '%';
  document.getElementById('progText').textContent = pct + '%';
}
function updateTeamLine(){
  const p = getV('team.problem');
  document.getElementById('teamLine').textContent = S ? `${S.cls}반 · ${S.team}${p?' · '+String(p).slice(0,40):''}` : '—';
}
function weekStart(d){ // 한국 시각 기준 이번 주 월요일
  const k = new Date(d.getTime() + 9*3600e3); const day = (k.getUTCDay()+6)%7;
  const m = new Date(Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate() - day));
  return m;
}
function weekLabel(m){ const e = new Date(m.getTime() + 6*86400e3); const f = x => `${x.getUTCMonth()+1}/${x.getUTCDate()}`; return `${f(m)}~${f(e)} 주`; }
function updateSubLine(){
  const el = document.getElementById('subLine');
  const wk = weekStart(new Date()).toISOString().slice(0,10);
  const mine = subs.filter(s => s.week === wk);
  if(mine.length){
    const s = mine[0]; const t = new Date(Number(s.at));
    el.textContent = `이번 주 제출함 · ${t.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} · ${s.submitter}`;
    el.className = 'text-xs mt-1 font-semibold text-mint-600';
  } else { el.textContent = '이번 주 제출 전'; el.className = 'text-xs mt-1 font-semibold text-amber-600'; }
}

async function doSubmit(){
  const who = document.getElementById('mdWho').value.trim(), note = document.getElementById('mdNote').value.trim();
  const msg = document.getElementById('mdMsg'), ok = document.getElementById('mdOk');
  if(!who){ msg.textContent = '제출자 학번과 이름을 적어 주세요.'; msg.className = 'text-sm text-rose-600'; return; }
  if(!note){ msg.textContent = '이번 주 한 것을 적어 주세요.'; msg.className = 'text-sm text-rose-600'; return; }
  if(!S || !S.alive){ msg.textContent = ERR.bad_token; msg.className = 'text-sm text-rose-600'; return; }
  ok.disabled = true; msg.className = 'text-sm text-slate-500'; msg.textContent = '쓴 내용을 저장하는 중…';
  const saved = await whenSaved(15000);
  if(!saved){ ok.disabled = false; msg.textContent = '아직 저장되지 않은 글이 있어 제출하지 못했음. 연결을 확인하고 다시 누를 것.'; msg.className = 'text-sm text-rose-600'; return; }
  msg.textContent = '제출하는 중…';
  try{

}

      const v = getV(sec.id+'.'+f.k);

      else if(typeof v === 'object') h += `<div style="font-size:14px">${f.sub.map(s=>v[s.k]?`<b>${esc(s.label)}:</b> ${esc(v[s.k])}`:'').filter(Boolean).join('<br>')}</div>`;

  window.print();
}

    $s('soCodePane').hidden = t !== 'code'; $s('soOutPane').hidden = t !== 'out';
    el.querySelectorAll('[data-sotab]').forEach(b => {
      const on = b.dataset.sotab === t; b.setAttribute('aria-selected', on);
      b.className = `${btn} ${on ? 'bg-slate-800 text-white' : 'bg-white text-slate-500 border border-slate-200'}`;
    });
  }
  function setKind(k){
    o.kind = k; $s('soKind').value = k;
    $s('soStdinBox').hidden = k !== 'Python';
    $s('soFrame').hidden = k !== 'HTML'; $s('soPy').hidden = k !== 'Python';
  }
  function dirtyCheck(){
    if(!o) return;
    const b = $s('soSave');
    if(o.mode === 'new'){ b.hidden = false; b.textContent = '팀에 올리기'; return; }
    b.hidden = !(o.canSave && $s('soCode').value !== savedCode);
    b.textContent = '고친 코드 팀에 저장';
  }

  /* ---------- 파이썬 ---------- */
  function newWorker(){
    const w = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], {type:'text/javascript'})));
    workerReady = false; w.onmessage = onWorker;
    w.onerror = e => { finish(); status('파이썬을 시작하지 못했음. 인터넷 연결을 확인할 것. ' + (e.message || ''), 'err'); };
    return w;
  }
  function onWorker(e){
    const m = e.data;
    if(m.type === 'ready'){ workerReady = true; return; }
    if(m.type === 'status'){ if(running) status(m.text); return; }
    if(m.type === 'out'){ out(m.text + '\n', ''); return; }
    if(m.type === 'err'){ out(cleanErr(m.text) + '\n', 'e'); return; }
    if(m.type === 'img'){ fig(m.data); return; }
    if(m.type === 'fatal'){ finish(); status('파이썬을 불러오지 못했음. 인터넷 연결을 확인하고 다시 실행할 것.', 'err'); try{ worker.terminate(); }catch(_){} worker = null; return; }
    if(m.type === 'done'){
      finish(); status(m.ok ? ('실행 끝 · ' + (m.ms/1000).toFixed(1) + '초') : '오류로 멈췄음. 빨간 글씨의 마지막 줄을 확인할 것.', m.ok ? 'ok' : 'err');
      // 한 번 쓴 파이썬은 버리고 새것을 미리 준비함: 이번 실행이 바꾼 것이 다음 실행에 남지 않게
      killWorker(); if(o && o.kind === 'Python') warm();
    }
  }
  function cleanErr(t){
    const keep = []; let skip = false;
    String(t).split('\n').forEach(l => {
      if(/File "\/lib\/python[^"]*_pyodide|File "\/lib\/python[^"]*pyodide\//.test(l)){ skip = true; return; }
      if(skip && /^\s{4}/.test(l)) return;
      skip = false; keep.push(l);
    });
    return keep.join('\n').replace(/\n+$/, '');
  }
  function out(text, cls){
    if(outChars > MAX_OUT) return;
    outChars += text.length;
    if(outChars > MAX_OUT){ text = '\n… 출력이 너무 길어 여기까지만 보여 줌\n'; cls = 'n'; }
    const sp = document.createElement('span'); if(cls === 'e') sp.className = 'text-rose-600'; else if(cls === 'n') sp.className = 'text-slate-400';
    sp.textContent = text; $s('soConsole').appendChild(sp);
    const box = $s('soPy'); box.scrollTop = box.scrollHeight;
  }
  function fig(b64){
    figCount++;
    if(figCount > MAX_FIGS){ if(figCount === MAX_FIGS + 1) out('… 그림이 너무 많아 ' + MAX_FIGS + '장까지만 보여 줌\n', 'n'); return; }
    const img = document.createElement('img'); img.alt = '그래프 ' + figCount; img.className = 'max-w-full rounded-xl border border-slate-100'; img.src = 'data:image/png;base64,' + b64;
    $s('soFigs').appendChild(img);
  }
  function finish(){ running = false; $s('soRun').disabled = false; $s('soStop').hidden = true; }
  function stopPython(){
    if(!running) return;
    if(worker){ worker.terminate(); worker = null; }
    finish(); out('\n■ 멈춤을 눌러 실행을 중단했음\n', 'n'); status('멈췄음. 다시 실행하면 파이썬을 새로 준비함.');
  }

  /* ---------- 실행 ---------- */
  function run(){
    if(!o) return;
    let code = $s('soCode').value;
    if(!code.trim()){ status('코드를 먼저 넣어 주세요.', 'err'); showTab('code'); return; }
    if(o.kind === 'Python'){
      const fixed = fixSmart(code);
      if(fixed !== code.replace(/\r\n?/g, '\n')){ $s('soCode').value = fixed; dirtyCheck(); }
      code = fixed;
      showTab('out');
      $s('soConsole').textContent = ''; $s('soFigs').textContent = ''; outChars = 0; figCount = 0;
      if(!worker) worker = newWorker();
      running = true; $s('soRun').disabled = true; $s('soStop').hidden = false;
      status(workerReady ? '실행 중…' : '파이썬 준비 중… (처음 한 번은 10~30초)');
      worker.postMessage({type:'run', code, stdin: fixSmart($s('soStdin').value)});
    } else {
      showTab('out');
      const wrap = $s('soFrame'); wrap.textContent = '';
      const f = document.createElement('iframe');
      f.title = 'HTML 실행 화면'; f.className = 'w-full h-full border-0 bg-white';
      // allow-same-origin 을 주지 않음: 올린 코드가 이 앱의 로그인 정보에 손댈 수 없음
      f.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals allow-pointer-lock allow-downloads');
      f.setAttribute('allow', 'fullscreen; accelerometer; gyroscope');
      f.srcdoc = code.replace(/\r\n?/g, '\n');
      wrap.appendChild(f);
      status('실행 중. 코드를 고친 뒤 다시 실행을 누르면 새로 고침.', 'ok');
    }
  }

  function loadFile(f){
    if(!f || !o) return;
    if(f.size > MAX_CODE){ status('파일이 너무 큼 (1.5MB까지).', 'err'); return; }
    const k = kindOf(f.name);
    const r = new FileReader();
    r.onload = () => {
      const text = String(r.result || '');
      $s('soCode').value = text;
      setKind(k || guessKind(text));
      o.fname = f.name;
      if(o.mode === 'new' && !$s('soT').value.trim()) $s('soT').value = f.name.replace(/\.[^.]+$/, '').slice(0, 60);
      dirtyCheck(); status(f.name + '을(를) 불러왔음. 실행을 눌러 확인한 뒤 팀에 올릴 것.');
      showTab('code');
    };
    r.onerror = () => status('파일을 읽지 못했음.', 'err');
    r.readAsText(f, 'utf-8');
  }

  async function save(){
    if(!o) return;
    let code = $s('soCode').value;
    if(!code.trim()){ status('코드를 먼저 넣어 주세요.', 'err'); return; }
    if(o.kind === 'Python') code = fixSmart(code); else code = code.replace(/\r\n?/g, '\n');
    if(new Blob([code]).size > MAX_CODE){ status('코드가 너무 김 (1.5MB까지).', 'err'); return; }
    const b = $s('soSave'); b.disabled = true; status('팀에 올리는 중…');
    try{
      if(o.mode === 'new'){
        const title = $s('soT').value.trim();
        if(!title){ status('제목을 적어 주세요.', 'err'); $s('soT').focus(); return; }
        const fname = o.fname || (title.replace(/[\\/:*?"<>|]/g, '').slice(0, 40) || 'simulation') + (o.kind === 'HTML' ? '.html' : '.py');
        const r = await o.onUpload({title, kind:o.kind, code, fname});
        if(!r || !r.ok){ status((r && r.msg) || '올리지 못했음. 다시 시도할 것.', 'err'); return; }
        // 올린 뒤에는 '보기' 상태로 바뀜 (고치면 다시 저장 가능)
        o.mode = 'view'; o.rowId = r.rowId; o.onSave = r.onSave; o.canSave = !!r.onSave;
        $s('soNew').hidden = true; $s('soTitle').textContent = `${title} · ${o.kind === 'HTML' ? 'HTML' : '파이썬'}`;
        savedCode = code; $s('soCode').value = code; dirtyCheck();
        status('팀에 올렸음. 닫은 뒤 카드의 설명 칸도 채울 것.', 'ok');
      } else {
        const r = await o.onSave(code);
        if(!r || !r.ok){ status((r && r.msg) || '저장하지 못했음. 다시 시도할 것.', 'err'); return; }
        savedCode = code; $s('soCode').value = code; dirtyCheck(); status('고친 코드를 팀에 저장했음.', 'ok');
      }
    }catch(e){ status('올리지 못했음. 인터넷 연결을 확인할 것.', 'err'); }
    finally{ b.disabled = false; }
  }

  // opts: {mode:'new'|'view', title, kind, canSave, load:async()=>code, onSave:async(code)=>{ok,msg}, onUpload:async({title,kind,code,fname})=>{ok,msg,rowId,onSave}, autorun, startTab}
  async function open(opts){
    if(!el) build();
    if(running) stopPython();
    killWorker();   // 열 때마다 새 파이썬: 앞 시뮬레이션이 바꿔 놓은 것이 남지 않게
    o = Object.assign({kind:'Python'}, opts);
    lastFocus = document.activeElement;
    if(el.hidden) prevOverflow = document.body.style.overflow;
    el.hidden = false; document.body.style.overflow = 'hidden';
    $s('soFrame').textContent = ''; $s('soConsole').textContent = ''; $s('soFigs').textContent = ''; $s('soStdin').value = '';
    $s('soNew').hidden = o.mode !== 'new';
    $s('soTitle').textContent = o.mode === 'new' ? '새 시뮬레이션 올리기' : `${o.title || '시뮬레이션'} · ${o.kind === 'HTML' ? 'HTML' : '파이썬'}`;
    $s('soCode').readOnly = o.mode !== 'new' && !o.canSave;
    setKind(o.kind); showTab(o.startTab || 'code');
    savedCode = ''; $s('soCode').value = ''; $s('soT').value = ''; o.fname = o.fname || '';
    dirtyCheck();
    if(o.mode === 'new'){ status('코드를 붙여 넣거나 파일을 열고, 실행으로 확인한 뒤 팀에 올림.'); $s('soT').focus(); warm(); return; }
    status('코드를 불러오는 중…'); $s('soRun').disabled = true;
    try{
      const code = await o.load();
      if(!el || el.hidden) return;
      savedCode = code; $s('soCode').value = code; dirtyCheck(); $s('soRun').disabled = false;
      status(o.canSave ? '코드를 고친 뒤 실행해 보고, 괜찮으면 저장을 누름.' : '');
      if(o.autorun) run(); else if(o.kind === 'Python') warm();
    }catch(e){ $s('soRun').disabled = false; status((e && e.msg) || '코드를 불러오지 못했음. 다시 열어 볼 것.', 'err'); }
    $s('soClose').focus();
  }
  function killWorker(){ if(worker){ try{ worker.terminate(); }catch(_){} worker = null; workerReady = false; } }
  function warm(){ if(!worker && o && o.kind === 'Python'){ worker = newWorker(); worker.postMessage({type:'warm'}); } }
  function close(){
    if(!el || el.hidden) return;
    if(o && o.mode === 'view' && o.canSave && $s('soCode').value !== savedCode && !confirm('저장하지 않은 코드 수정이 있음. 그래도 닫을까요?')) return;
    if(o && o.mode === 'new' && $s('soCode').value.trim() && !confirm('아직 팀에 올리지 않았음. 그래도 닫을까요?')) return;
    if(running) stopPython();
    killWorker();
    $s('soFrame').textContent = '';   // 애니메이션 멈춤
    el.hidden = true; document.body.style.overflow = prevOverflow; o = null;
    if(lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
  }
  const isOpen = () => !!(el && !el.hidden);
  return {open, close, isOpen, textToDataURL, dataURLToText};
})();
/*SIMRUN-END*/

/* ============================================================
   12-1. 시뮬레이션 탭 (코드는 팀 첨부 공간에 'simcode'로 저장, 목록은 sim.items)
   ============================================================ */
const SIM_KEY = 'sim.items';
const codeCache = {};
const simRow = id => (getV(SIM_KEY) || []).find(r => r && r._id === id);
async function simUploadCode(code, kind, fname){
  const T = S; if(!T || !T.alive) return {ok:false, msg:ERR.bad_token};
  const data = SimRun.textToDataURL(code, kind === 'HTML' ? 'text/html' : 'text/x-python');
  const r = await rpc('ws_file_add', {p_token:T.token, p_sec:'simcode', p_name:String(fname).slice(0,120), p_type: kind === 'HTML' ? 'text/html' : 'text/x-python', p_data:data});
  if(!r || !r.ok){ if(r && r.error === 'bad_token') kicked(); return {ok:false, msg:errText(r && r.error)}; }
  files.push({id:r.id, sec:'simcode', name:fname, type:'', size:r.size}); codeCache[r.id] = code;
  return {ok:true, id:r.id, size:r.size};
}
function simSaver(rowId){
  return async code => {
    const row = simRow(rowId); if(!row) return {ok:false, msg:'이 시뮬레이션이 지워졌음.'};
    if(!editable()) return {ok:false, msg:ERR.bad_token};
    const old = row.fid;
    const u = await simUploadCode(code, row.kind, row.fname || 'simulation');
    if(!u.ok) return u;
    // 예전 코드 파일은 지우지 않음: 지난 주 제출본에서도 그때 코드를 열 수 있게
    opPush(SIM_KEY, {op:'rset', id:rowId, f:'fid', v:u.id}, 0);
    opPush(SIM_KEY, {op:'rset', id:rowId, f:'size', v:u.size}, 0);
    if(SECTIONS[cur].id === 'sim') render(false);
    simPrune(old);
    return {ok:true};
  };
}
// 바꾸기 전 코드 파일: 지난 제출본에서 쓰이지 않으면 치워 팀 공간(8MB)을 돌려받음
async function simPrune(fid){
  if(!fid) return;
  const T = S;
  if(!(await whenSaved(15000)) || T !== S || !T.alive) return;
  try{
    const r = await rpc('ws_sim_prune', {p_token:T.token, p_fid:fid});
    if(r && r.ok && r.pruned && T === S){ files = files.filter(f => f.id !== fid); delete codeCache[fid]; if(SECTIONS[cur].id !== 'sim' || !document.activeElement || !document.activeElement.dataset || !document.activeElement.dataset.path) renderFiles(); }
  }catch(e){}
}
async function simLoad(row){
  if(codeCache[row.fid] != null) return codeCache[row.fid];
  const r = await rpc('ws_file_get', {p_token:S.token, p_id:row.fid});
  if(!r || !r.ok){ if(r && r.error === 'bad_token') kicked(); throw {msg: r && r.error === 'not_found' ? '코드 파일을 찾지 못했음.' : errText(r && r.error)}; }
  return (codeCache[row.fid] = SimRun.dataURLToText(r.data));
}
document.addEventListener('click', e => {
  if(!S || !S.loaded) return;
  if(e.target.closest('[data-simnew]')){
    if(!editable()) return;
    SimRun.open({mode:'new', onUpload: async ({title, kind, code, fname}) => {
      const u = await simUploadCode(code, kind, fname);
      if(!u.ok) return u;
      const id = uid();
      opPush(SIM_KEY, {op:'add', row:{_id:id, t:title, kind, fid:u.id, fname, size:u.size, desc:''}}, 0);
      if(SECTIONS[cur].id === 'sim') render(false);
      return {ok:true, rowId:id, onSave: simSaver(id)};
    }});
    return;
  }
  const rb = e.target.closest('[data-simrun],[data-simcode]');
  if(rb){
    const id = rb.dataset.simrun || rb.dataset.simcode, row = simRow(id); if(!row) return;
    SimRun.open({mode:'view', title:row.t || '제목 없음', kind:row.kind === 'HTML' ? 'HTML' : 'Python', fname:row.fname,
      canSave: editable(), onSave: simSaver(id), load: () => simLoad(row), autorun: !!rb.dataset.simrun, startTab: rb.dataset.simrun ? 'out' : 'code'});
    return;
  }
  const db = e.target.closest('[data-simdel]');
  if(db && editable()){
    const row = simRow(db.dataset.simdel); if(!row) return;
    if(!confirm(`'${row.t || '제목 없음'}' 시뮬레이션을 목록에서 지울까요?`)) return;
    opPush(SIM_KEY, {op:'del', id:row._id}, 300); render(false);
    simPrune(row.fid);
  }
});

/* ============================================================
   13. 시작
   ============================================================ */
document.getElementById('loginForm').addEventListener('submit', e => { e.preventDefault(); doLogin(false); });
document.getElementById('btnCreate').addEventListener('click', () => doLogin(true));
window.addEventListener('pagehide', flushAll);
window.addEventListener('beforeunload', e => { flushAll(); if(anyDirty()){ e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') flushAll(); else if(S && S.alive && S.loaded) poll(); });

(function init(){
  const c = lsGet('ws_class'), t = lsGet('ws_team'), tok = lsGet('ws_token');
  if(c) document.getElementById('lgClass').value = c;
  if(t) document.getElementById('lgName').value = t;
  if(tok && /^[0-9a-f-]{36}$/i.test(tok) && t){ document.getElementById('lgRemember').checked = true; enter({token:tok, team:t, cls:Number(c)}, false); }
  else if(tok) lsDel('ws_token');
})();
</script>
